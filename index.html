<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dépenses">
<meta name="theme-color" content="#6d5dfc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Dépenses</title>
<style>
  :root {
    --bg: #f3f2f8; --card: #ffffff; --card2: #f1f0f6; --txt: #17161f; --mut: #8a8799; --line: #ecebf2;
    --accent: #6d5dfc; --accent2: #4f6bff; --up: #ef4444; --down: #16a34a; --danger: #ef4444; --orange: #f59e0b;
    --fab: #17161f; --fab-txt: #ffffff; --ombre: 0 10px 30px rgba(40, 30, 90, .12);
    --degrade: linear-gradient(135deg, #8b5cf6 0%, #6d5dfc 45%, #4f6bff 100%);
    --bas-barre: max(18px, calc(env(safe-area-inset-bottom) - 12px));
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f0e15; --card: #1a1922; --card2: #24232e; --txt: #f4f3fa; --mut: #8f8ca0; --line: #2c2a37;
      --fab: #f4f3fa; --fab-txt: #0f0e15; --ombre: 0 10px 30px rgba(0, 0, 0, .5); --up: #f87171; --down: #4ade80;
      --degrade: linear-gradient(135deg, #5b3fd6 0%, #4b3fc9 45%, #3346c4 100%); }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: var(--h, 100%); background: var(--bg); color: var(--txt); overscroll-behavior: none; overflow: hidden;
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }

  #appli { position: fixed; top: 0; left: 0; right: 0; height: var(--h, 100%); display: flex; flex-direction: column; overflow: hidden; }
  #contenu { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(130px + env(safe-area-inset-bottom)); }

  /* En-tête dégradé (façon Buddy) */
  .tete { background: var(--degrade); color: #fff; padding: calc(16px + env(safe-area-inset-top)) 16px 10px;
    box-shadow: 0 6px 24px rgba(79, 70, 229, .25); flex: none; position: relative; z-index: 3; }
  .tete-haut { display: flex; align-items: center; justify-content: space-between; max-width: 560px; margin: 0 auto; }
  .verre { width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.18);
    color: #fff; display: flex; align-items: center; justify-content: center; padding: 0; }
  .verre svg { width: 21px; height: 21px; }
  .ic-cal { width: 13px; height: 13px; vertical-align: -1px; margin-right: 6px; }
  .tete-titre { font-size: 16px; font-weight: 500; opacity: .95; }
  .tete-titre b { font-weight: 700; }
  .segments-tete { display: flex; justify-content: center; gap: 6px; margin: 10px auto 0; max-width: 560px; }
  .segments-tete:empty { display: none; }
  .segments-tete button { border: 0; background: none; color: rgba(255,255,255,.85); font-size: 12.5px; font-weight: 700;
    letter-spacing: .1em; padding: 9px 13px; border-radius: 99px; text-transform: uppercase; white-space: nowrap; }
  @media (max-width: 380px) { .segments-tete button { letter-spacing: .05em; padding: 9px 10px; font-size: 12px; } }
  .segments-tete button.actif { background: rgba(255,255,255,.22); color: #fff; }

  /* Barre du bas + bouton + */
  .onglets { position: absolute; left: 50%; transform: translateX(-50%); bottom: var(--bas-barre); display: flex; gap: 2px;
    width: min(76%, 400px);
    background: color-mix(in srgb, var(--card) 86%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--line); border-radius: 99px; padding: 5px; box-shadow: var(--ombre); z-index: 5; }
  .onglets button { flex: 1; border: 0; background: none; border-radius: 99px; padding: 8px 4px 6px; display: flex; flex-direction: column;
    align-items: center; gap: 2px; font-size: 11.5px; font-weight: 600; color: var(--mut); }
  .onglets button svg { width: 23px; height: 23px; }
  .onglets button.actif { background: var(--card2); color: var(--txt); }
  .onglets button.actif svg { color: var(--accent); }
  .fab { position: absolute; right: 16px; bottom: calc(var(--bas-barre) + 74px); width: 58px; height: 58px; border-radius: 50%; border: 0;
    background: var(--fab); color: var(--fab-txt); font-size: 34px; font-weight: 300; line-height: 1; box-shadow: var(--ombre); z-index: 6; }
  .fab:active { transform: scale(.94); }

  /* Cartes */
  .card { background: var(--card); border-radius: 24px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(40, 30, 90, .04); }
  h2 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--mut); margin: 0 0 12px; }
  .lbl { font-size: 12px; color: var(--mut); }
  .vide { color: var(--mut); text-align: center; padding: 24px 0; }
  .chargement { color: var(--mut); text-align: center; padding: 80px 0; }
  .maj { text-align: center; font-size: 12px; color: var(--mut); margin-top: 6px; }
  .positif { color: var(--down); }
  .negatif { color: var(--up); }
  .puce { border: 0; background: var(--card2); color: var(--txt); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 600; }

  /* Carte du mois */
  .carte-mois { display: flex; align-items: center; justify-content: space-between; background: var(--card); border-radius: 99px;
    padding: 7px 10px; margin-bottom: 14px; box-shadow: var(--ombre); }
  .carte-mois button { width: 38px; height: 38px; border: 0; background: none; font-size: 24px; color: var(--txt); font-weight: 300; }
  .carte-mois button:disabled { opacity: .2; }
  .carte-mois .centre { text-align: center; }
  .carte-mois .centre b { display: block; font-size: 17px; font-weight: 500; text-transform: capitalize; }
  .carte-mois .centre span { font-size: 10.5px; letter-spacing: .16em; color: var(--mut); font-weight: 600; text-transform: uppercase; }
  .carte-mois .centre span i { font-style: normal; letter-spacing: 0; }

  /* Bloc revenus / dépenses / solde */
  .bilan3 { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; background: var(--card2); border-radius: 16px; padding: 13px 6px; }
  .bilan3 b { display: block; font-size: 16.5px; font-weight: 500; margin-bottom: 3px; letter-spacing: -.01em; }
  .bilan3 span { font-size: 10px; letter-spacing: .14em; color: var(--mut); font-weight: 600; text-transform: uppercase; }

  /* Lignes de transaction (façon Buddy) */
  .tx { display: flex; align-items: center; gap: 13px; padding: 12px 0; background: var(--card); position: relative; }
  .pastille { width: 44px; height: 44px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .pastille img { width: 27px; height: 27px; border-radius: 8px; object-fit: contain; }
  .pastille.logo { background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
  .tx .info { flex: 1; min-width: 0; }
  .tx .date { font-size: 10px; font-weight: 700; letter-spacing: .13em; color: var(--mut); text-transform: uppercase; margin-bottom: 2px; }
  .tx .titre { font-size: 15.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx .sous { font-size: 13px; color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx .mt { font-size: 15.5px; font-weight: 600; text-align: right; white-space: nowrap; }
  .tx .mt.barre-txt { text-decoration: line-through; color: var(--mut); font-weight: 500; }
  .tx .ajout { display: block; border: 0; background: none; color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .08em;
    padding: 4px 0 0; text-transform: uppercase; margin-left: auto; }
  .tx .droite { flex: none; text-align: right; }
  .tx .date { white-space: nowrap; }
  .badge-mini { font-size: 11px; font-weight: 600; margin-left: 6px; }
  .badge-mini.etiq { color: var(--accent); }
  .badge-mini.remb { color: var(--orange); }
  .badge-mini.remb.ok { color: var(--mut); text-decoration: line-through; }
  .swipe { position: relative; overflow: hidden; }
  .swipe-fond { position: absolute; inset: 4px 0; background: var(--danger); color: #fff; border-radius: 16px; display: flex; align-items: center;
    justify-content: flex-end; padding-right: 18px; font-weight: 700; font-size: 14px; opacity: 0; }
  .swipe > .tx { touch-action: pan-y; transition: transform .2s; }
  .swipe + .swipe > .tx, .tx + .tx, .swipe + .tx, .tx + .swipe > .tx { border-top: 1px solid var(--line); }
  .filtre-actif { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 4px; }

  /* Lignes génériques (statistiques, outils) */
  .ligne { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
  .ligne + .ligne { border-top: 1px solid var(--line); }
  .clic { cursor: pointer; }
  .ligne .info { flex: 1; min-width: 0; }
  .ligne .nom { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ligne .sous { font-size: 13px; color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ligne .mt { font-weight: 700; text-align: right; white-space: nowrap; }
  .ligne .mt small { display: block; font-weight: 500; color: var(--mut); font-size: 12px; }
  .ico { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 19px; flex: none; background: var(--card2); }
  .ico img { width: 26px; height: 26px; border-radius: 7px; object-fit: contain; }
  .ico.logo { background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
  .jauge { height: 6px; border-radius: 99px; background: var(--card2); margin-top: 6px; overflow: hidden; }
  .jauge span { display: block; height: 100%; border-radius: 99px; }
  .cat.actif .nom { color: var(--accent); }
  .rang { width: 16px; font-size: 13px; font-weight: 700; color: var(--mut); text-align: center; flex: none; }

  /* Aperçu */
  .resume { display: flex; align-items: center; gap: 18px; margin-bottom: 16px; }
  .anneau { position: relative; width: 140px; height: 140px; flex: none; }
  .anneau svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .anneau .centre { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .anneau .centre .val { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .stats { display: grid; gap: 10px; flex: 1; min-width: 0; }
  .stat .val { font-size: 17px; font-weight: 700; }
  .badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
  .badge.up { background: color-mix(in srgb, var(--up) 15%, transparent); color: var(--up); }
  .badge.down { background: color-mix(in srgb, var(--down) 15%, transparent); color: var(--down); }
  .barre { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--card2); margin-bottom: 12px; }
  .barre span { height: 100%; }
  .legende { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; }
  .legende i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .legende b { margin-left: 4px; }
  .histo { display: flex; align-items: flex-end; gap: 8px; height: 130px; }
  .histo .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; cursor: pointer; }
  .histo .b { width: 100%; max-width: 34px; border-radius: 8px 8px 4px 4px; background: color-mix(in srgb, var(--accent) 30%, var(--card2)); min-height: 3px; }
  .histo .col.sel .b { background: var(--accent); }
  .histo .m { font-size: 11px; color: var(--mut); margin-top: 6px; text-transform: capitalize; }
  .histo .v { font-size: 10px; color: var(--mut); margin-bottom: 4px; white-space: nowrap; }
  .histo .col.sel .m, .histo .col.sel .v { color: var(--txt); font-weight: 700; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal .js { font-size: 11px; color: var(--mut); text-align: center; padding-bottom: 2px; }
  .cal button { aspect-ratio: 1; border: 0; border-radius: 10px; background: var(--card2); font-size: 13px; font-weight: 600; padding: 0; }
  .cal button.auj { box-shadow: inset 0 0 0 2px var(--accent); }
  .cal button:disabled { opacity: .3; }
  .cal-legende { display: flex; align-items: center; gap: 4px; justify-content: flex-end; font-size: 11px; color: var(--mut); margin-top: 10px; }
  .cal-legende i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .entre { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; gap: 10px; }
  .entre b { font-size: 24px; letter-spacing: -.02em; }

  /* Outils : catégories façon Buddy */
  .groupe-titre { font-size: 22px; font-weight: 500; margin: 0 0 6px; display: flex; align-items: center; gap: 10px; }
  .groupe-titre button { border: 0; background: none; font-size: 18px; padding: 0; color: var(--mut); }
  .moins { width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--danger); color: #fff; font-size: 22px;
    line-height: 1; flex: none; display: flex; align-items: center; justify-content: center; padding-bottom: 3px; }
  .action-ligne { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; color: var(--mut); cursor: pointer; font-size: 16px; }
  .action-ligne + .action-ligne { border-top: 1px solid var(--line); }
  .action-ligne span:last-child { font-size: 22px; }

  /* Dettes */
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .duo > div { background: var(--card2); border-radius: 18px; padding: 14px; }
  .duo b { display: block; font-size: 22px; letter-spacing: -.02em; margin-top: 2px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; background: var(--degrade); }
  .ok-btn { border: 0; background: color-mix(in srgb, var(--down) 15%, transparent); color: var(--down); border-radius: 99px; padding: 7px 11px; font-size: 13px; font-weight: 700; white-space: nowrap; }

  /* Recherche */
  .champ-recherche { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 16px; padding: 12px 14px; margin-bottom: 14px; box-shadow: var(--ombre); }
  .champ-recherche input { flex: 1; border: 0; background: none; outline: none; font-size: 17px; min-width: 0; }

  /* Interrupteur */
  .switch { position: relative; width: 50px; height: 30px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--card2); transition: .2s; border: 1px solid var(--line); }
  .switch i::after { content: ''; position: absolute; width: 24px; height: 24px; left: 2px; top: 2px; border-radius: 50%; background: #fff; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .switch input:checked + i { background: var(--down); border-color: var(--down); }
  .switch input:checked + i::after { transform: translateX(20px); }

  /* Feuilles (panneaux qui montent du bas) */
  #couche { position: absolute; inset: 0; z-index: 20; display: none; }
  #couche.ouvert { display: block; }
  .voile { position: absolute; inset: 0; background: rgba(15, 10, 40, .45); opacity: 0; transition: opacity .2s; }
  #couche.visible .voile { opacity: 1; }
  .feuille { position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100% - env(safe-area-inset-top) - 18px); overflow-y: auto; background: var(--card);
    border-radius: 30px 30px 0 0; padding: 14px 18px calc(30px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .25s ease-out; max-width: 600px; margin: 0 auto; }
  #couche.visible .feuille { transform: none; }
  .feuille.pleine { height: calc(100% - env(safe-area-inset-top) - 18px); display: flex; flex-direction: column; padding-bottom: 0; }

  /* Nouvelle transaction façon Buddy */
  .saisie-montant { display: flex; align-items: baseline; justify-content: center; margin: 4px 0 10px; }
  .saisie-montant input { border: 0; background: none; outline: none; font-size: 60px; font-weight: 300; text-align: right; padding: 0;
    width: .9em; max-width: 80%; caret-color: var(--accent); }
  .saisie-montant span { font-size: 30px; font-weight: 300; margin-left: 10px; }
  .types { display: flex; justify-content: center; gap: 8px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin: 0 -18px; }
  .types button { border: 0; background: none; border-radius: 99px; padding: 11px 22px; font-size: 12.5px; font-weight: 600; letter-spacing: .16em; color: var(--txt); }
  .types button.sel { background: var(--card2); }
  .rangee { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); min-height: 64px; position: relative; }
  .rangee .rond-ic { width: 40px; height: 40px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 19px; }
  .rangee .ic-trait { width: 40px; flex: none; display: flex; justify-content: center; color: var(--txt); }
  .rangee .ic-trait svg { width: 26px; height: 26px; }
  .rangee .texte { flex: 1; font-size: 16px; color: var(--mut); min-width: 0; }
  .rangee .texte b { color: var(--txt); font-weight: 600; }
  .rangee input[type=text] { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 16px; padding: 0; }
  .rangee select.cache { position: absolute; inset: 0; opacity: 0; width: 100%; font-size: 16px; }
  .rangee .fleches { display: flex; gap: 6px; }
  .rangee .fleches button { border: 0; background: none; font-size: 26px; padding: 0 8px; color: var(--txt); }
  .rangee .fleches button:disabled { opacity: .2; }
  .sous-champs { padding: 4px 0 6px 54px; border-bottom: 1px solid var(--line); }
  .sous-champs .ligne-champ { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
  .sous-champs input { flex: 1; min-width: 0; border: 0; background: var(--card2); border-radius: 12px; padding: 10px 12px; font-size: 15px; outline: none; }

  /* Choix de catégorie façon Buddy */
  .choix-tete { display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px; }
  .choix-tete h3 { margin: 0; font-size: 18px; }
  .pilule { display: flex; border: 1px solid var(--line); border-radius: 99px; background: var(--card); box-shadow: var(--ombre); }
  .pilule button { border: 0; background: none; width: 46px; height: 42px; display: flex; align-items: center; justify-content: center; color: var(--txt); }
  .pilule button svg { width: 22px; height: 22px; }
  .choix-corps { flex: 1; overflow-y: auto; margin: 0 -18px; padding: 0 18px calc(100px + env(safe-area-inset-bottom)); }
  .choix-groupe { font-size: 21px; font-weight: 400; padding: 14px 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .choix-grille { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 6px; margin-bottom: 10px; }
  .choix-grille button { border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 0; }
  .choix-grille .bulle { width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 25px; }
  .choix-grille .bulle.sel { box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--accent); }
  .choix-grille span { font-size: 11.5px; color: var(--txt); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .choix-recherche { position: absolute; left: 18px; right: 18px; bottom: calc(env(safe-area-inset-bottom) + 12px); display: flex; align-items: center; gap: 10px;
    background: color-mix(in srgb, var(--card) 85%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--line); border-radius: 99px; padding: 12px 18px; box-shadow: var(--ombre); }
  .choix-recherche svg { width: 20px; height: 20px; flex: none; }
  .choix-recherche input { flex: 1; border: 0; background: none; outline: none; font-size: 16px; min-width: 0; }

  .feuille-tete { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .feuille-tete h3 { margin: 0; font-size: 18px; }
  .rond { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); font-size: 18px; box-shadow: var(--ombre); }
  .gros-montant { display: flex; align-items: baseline; justify-content: center; gap: 6px; margin: 6px 0 16px; }
  .gros-montant input { width: 100%; max-width: 220px; text-align: center; font-size: 64px; font-weight: 300; border: 0; background: none; outline: none; padding: 0; }
  .gros-montant span { font-size: 34px; font-weight: 300; }
  .segments { display: flex; background: var(--card2); border-radius: 14px; padding: 3px; flex: 1; }
  .segments button { flex: 1; border: 0; background: none; border-radius: 11px; padding: 9px 2px; font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--mut); text-transform: uppercase; }
  .segments button.sel { background: var(--card); color: var(--txt); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .champ { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
  .champ > .ic { width: 30px; text-align: center; font-size: 21px; flex: none; }

const commerceCache = {};
function commerce(note) {
  const n = sansAccents(note);
  if (!n) return null;
  if (!(n in commerceCache)) {
    const t = COMMERCES.find(([re]) => re.test(n));
    commerceCache[n] = t ? { nom: t[1], domaine: t[2] } : null;

}

const groupeDe = r => r.g || groupeCat(r.c);

}

/* ---------- Échanges avec le serveur ---------- */
// Le code est gardé à deux endroits (stockage local + cookie de 10 ans) pour ne jamais le redemander
function lireCookie() { const m = document.cookie.match(/(?:^|; )depcode=([^;]*)/); return m ? decodeURIComponent(m[1]) : ''; }
function lireCode() {
  let c = '';
  try { c = localStorage.getItem(CLE_CODE) || ''; } catch (e) {}
  if (!c) { c = lireCookie(); if (c) try { localStorage.setItem(CLE_CODE, c); } catch (e) {} }
  return c;
}
function enregistrerCode(v) {
  try { localStorage.setItem(CLE_CODE, v); } catch (e) {}
  document.cookie = `depcode=${encodeURIComponent(v)}; max-age=${10 * 365 * 24 * 3600}; path=/; SameSite=Strict; Secure`;
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  return !!lireCode();
}
function oublierCode() {
  try { localStorage.removeItem(CLE_CODE); } catch (e) {}
  document.cookie = 'depcode=; max-age=0; path=/; SameSite=Strict; Secure';
}
// Lien d'installation : …/depenses/#code=XXXX enregistre le code puis l'efface de l'adresse
(function () {
  const m = location.hash.match(/code=([^&]+)/);
  if (m) { enregistrerCode(decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname + location.search); }
})();

function appel(action, ...args) {
  if (MODE_DEMO) {
    return new Promise((ok, ko) => setTimeout(() => {
      try { ok(DEMO[action](...args.map(a => JSON.parse(JSON.stringify(a ?? null))))); } catch (e) { ko(e); }

  }
  // text/plain : requête « simple », sans pré-vol CORS (qu'Apps Script ne gère pas)
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ cle: lireCode(), action, args }) })
    .then(r => r.json())
    .then(j => {
      if (j.ok) return j.resultat;
      if (/Accès refusé/.test(j.message)) afficherConnexion('Code refusé, vérifie-le.');
      throw new Error(j.message.replace(/^❌\s*/, ''));
    });
}

// Les réponses parties avant la dernière écriture sont ignorées (sinon l'ancien état revient un instant)
let ecrituresEnCours = 0, derniereEcriture = 0, dernierChargement = 0;
function charger() {
  if (!MODE_DEMO && !lireCode()) return afficherConnexion();
  const debut = Date.now();
  dernierChargement = debut;
  return appel('getTout').then(t => {
    if (ecrituresEnCours > 0 || debut < derniereEcriture) return;
    recevoir(t);
  }).catch(err => {
    if (/Accès refusé/.test(err.message)) return; // l'écran du code est déjà affiché
    if (!charge) document.querySelector('main').innerHTML = `<div class="chargement">⚠️ ${esc(err.message)}<br><br><button class="puce" onclick="charger()">Réessayer</button></div>`;
    else if (!/Accès refusé/.test(err.message)) toast('⚠️ Synchro impossible : ' + err.message);
  });
}

function ecrire(action, args, appliquerLocal, messageOk) {
  if (appliquerLocal) appliquerLocal();
  sauverCache();
  if (!feuilleOuverte()) render();
  ecrituresEnCours++;
  return appel(action, ...args)
    .then(res => { if (messageOk) toast(messageOk); return res; })
    .catch(e => { toast('⚠️ ' + e.message); derniereEcriture = Date.now(); })
    .finally(() => {
      ecrituresEnCours--;
      derniereEcriture = Date.now();
      if (!ecrituresEnCours) setTimeout(charger, 50);
    });
}

function recevoir(t, depuisCache) {
  depenses = (t.depenses || []).map(r => ({ ...r, date: new Date(r.d) }))
    .filter(r => !isNaN(r.date) && r.m > 0 && !enAttenteSuppression[r.id]);
  categories = t.categories || [];
  recurrentes = t.recurrentes || [];
  dettes = (t.dettes || []).map(d => ({ ...d, date: new Date(d.d) }));
  if (depuisCache) majA = new Date(t.majA || Date.now());
  else { majA = new Date(); synchro = false; sauverCache(); }
  charge = true;
  if (!feuilleOuverte()) render();
}

function sauverCache() {
  if (!charge) return;
  const brut = { depenses: depenses.map(({ date, ...r }) => ({ ...r, d: versTexteDate(date) + ':00' })),
    categories, recurrentes, dettes: dettes.map(({ date, ...d }) => ({ ...d, d: versTexteDate(date) + ':00' })), majA: majA ? majA.getTime() : Date.now() };
  try { localStorage.setItem(CLE_CACHE, JSON.stringify(brut)); } catch (e) { /* stockage indisponible */ }
}

// Ouverture instantanée : dernières données connues, puis synchro
function chargerCache() {
  try {
    const t = JSON.parse(localStorage.getItem(CLE_CACHE) || 'null');
    if (t && t.depenses) recevoir(t, true);
  } catch (e) { /* cache absent ou illisible */ }
}

let toastMinuteur;
function toast(msg, action, duree) {
  const t = document.getElementById('toast');
  t.innerHTML = esc(msg) + (action ? `<button>${esc(action.texte)}</button>` : '');
  if (action) t.querySelector('button').onclick = () => { t.classList.remove('visible'); action.fn(); };
  t.classList.add('visible');
  clearTimeout(toastMinuteur);
  toastMinuteur = setTimeout(() => t.classList.remove('visible'), duree || 2200);
}

/* ---------- Connexion ---------- */
function afficherConnexion(erreur) {
  document.getElementById('segments').innerHTML = '';
  document.getElementById('fab').style.display = 'none';
  document.querySelector('.onglets').style.display = 'none';
  document.querySelector('main').innerHTML = `
    <div class="connexion">
      <div class="logo">€</div>
      <h2 style="font-size:20px;text-transform:none;letter-spacing:0;color:var(--txt)">Bienvenue 👋</h2>
      <p class="lbl" style="font-size:15px;margin:0 0 20px">Colle ton code d'accès. Il reste enregistré sur ce téléphone.</p>
      ${erreur ? `<p class="negatif" style="font-weight:600">${esc(erreur)}</p>` : ''}
      <input id="code" type="password" placeholder="Code d'accès" autocomplete="off" autocapitalize="off"
        onkeydown="if(event.key==='Enter')validerCode()">
      <button class="btn principal" onclick="validerCode()">CONTINUER</button>
      <p class="lbl" style="margin-top:22px"><a href="?demo" style="color:var(--accent)">Voir la démo</a></p>
    </div>`;
}
function validerCode() {
  const v = document.getElementById('code').value.trim();
  if (!v) return;
  if (!enregistrerCode(v)) return toast('Stockage impossible (navigation privée ?)');
  document.getElementById('fab').style.display = '';
  document.querySelector('.onglets').style.display = '';
  document.querySelector('main').innerHTML = '<div class="chargement">Connexion…</div>';
  charger();
}
function seDeconnecter() {
  confirmer('Changer de code ?', 'Tes données restent dans le Google Sheet. Il faudra recoller le code.', 'Se déconnecter').then(oui => {
    if (!oui) return;
    oublierCode(); try { localStorage.removeItem(CLE_CACHE); } catch (e) {}
    charge = false; afficherConnexion();
  });
}

/* ---------- Rendu ---------- */
const SEGMENTS = {
  accueil: [['liste', 'Liste'], ['apercu', 'Aperçu'], ['budget', 'Budget']],
  outils: [['recurrentes', 'Récurrentes'], ['categories', 'Catégories'], ['reglages', 'Réglages']],
};

function render() {
  if (!charge) return;
  document.querySelectorAll('.onglets button').forEach(b => b.classList.toggle('actif', b.dataset.o === onglet));
  const segs = rechercheActive ? [] : (SEGMENTS[onglet] || []);
  document.getElementById('segments').innerHTML = segs.map(([k, l]) =>
    `<button class="${sousOnglets[onglet] === k ? 'actif' : ''}" onclick="changerSousOnglet('${k}')">${l}</button>`).join('');
  document.getElementById('titre').innerHTML = rechercheActive ? '<b>Recherche</b>'
    : onglet === 'dettes' ? '<b>Dettes</b>' : onglet === 'outils' ? '<b>Outils</b>' : 'Aperçu : <b>Perso</b>';
  if (rechercheActive) return renderRecherche();
  let html;
  if (onglet === 'dettes') html = vueDettes();
  else if (onglet === 'outils') {
    const s = sousOnglets.outils;
    html = s === 'categories' ? vueCategories() : s === 'reglages' ? vueReglages() : vueRecurrentes();
  } else {
    const s = sousOnglets.accueil;
    html = s === 'apercu' ? vueApercu() : s === 'budget' ? vueBudget() : vueListe();
  }
  document.querySelector('main').innerHTML = html + `<div class="maj">${synchro ? '↻ synchro…' : 'À jour · ' + majA.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })} · v${VERSION}${MODE_DEMO ? ' · démo' : ''}</div>`;
}

function changerOnglet(o, sous) {
  onglet = o; if (sous) sousOnglets[o] = sous;
  catFiltre = null; jourFiltre = null; rechercheActive = false;
  render(); document.getElementById('contenu').scrollTop = 0;
}
function changerSousOnglet(k) { sousOnglets[onglet] = k; render(); document.getElementById('contenu').scrollTop = 0; }

function boutonPlus() {
  if (onglet === 'dettes') return ouvrirDette(null);
  if (onglet === 'outils' && sousOnglets.outils === 'recurrentes') return ouvrirRecurrente(null);
  if (onglet === 'outils' && sousOnglets.outils === 'categories') return ouvrirCategorie(null);
  ouvrirDepense(null);
}

function duMois(k) { return depenses.filter(r => cleMois(r.date) === k); }            // dépenses + revenus
function depensesDuMois(k) { return duMois(k).filter(r => !estRevenu(r)); }          // dépenses seules

function carteMois() {
  const nb = duMois(moisSel).length;
  const estMoisActuel = moisSel === cleMois(new Date());
  const premier = depenses.length ? cleMois(new Date(Math.min(...depenses.map(r => r.date)))) : moisSel;
  return `
    <div class="carte-mois">
      <button onclick="changerMois(-1)" ${moisSel <= premier ? 'disabled' : ''} aria-label="Mois précédent">‹</button>
      <div class="centre"><b>${nomMois(moisSel)}</b><span>${nb} transaction${nb > 1 ? 's' : ''}</span></div>
      <button onclick="changerMois(1)" ${estMoisActuel ? 'disabled' : ''} aria-label="Mois suivant">›</button>
    </div>`;
}

function bilan3(tout) {
  const total = somme(tout.filter(r => !estRevenu(r)));
  const revenus = somme(tout.filter(estRevenu));
  const solde = revenus - total;
  return `<div class="bilan3">
    <div><b>${eur0(revenus)}</b><span>Revenus</span></div>
    <div><b>${eur0(total)}</b><span>Dépenses</span></div>
    <div><b class="${solde >= 0 ? '' : 'negatif'}">${solde < 0 ? '-' : ''}${eur0(Math.abs(solde))}</b><span>Solde</span></div>
  </div>`;
}

/* ===== LISTE (écran d'ouverture, façon Buddy) ===== */
function vueListe() {
  const tout = duMois(moisSel);
  const estMoisActuel = moisSel === cleMois(new Date());
  const filtre = r => (!catFiltre || r.c === catFiltre) && (!jourFiltre || r.date.getDate() === jourFiltre);
  const liste = tout.filter(filtre).sort((a, b) => b.date - a.date);
  const aVenir = estMoisActuel && !catFiltre && !jourFiltre ? aVenirCeMois() : [];
  const libFiltre = jourFiltre ? new Date(dateDeCle(moisSel).getFullYear(), dateDeCle(moisSel).getMonth(), jourFiltre)
    .toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }) : catFiltre;
  return `
    ${carteMois()}
    <section class="card">
      ${bilan3(tout)}
      ${libFiltre ? `<div class="filtre-actif"><b style="text-transform:capitalize">${esc(libFiltre)}</b>
        <button class="puce" onclick="catFiltre=null;jourFiltre=null;render()">Tout voir</button></div>` : ''}
      ${aVenir.map(({ r, d }) => `
        <div class="tx clic" onclick="ouvrirRecurrente(${r.ligne})">
          ${pastille(r.libelle, emojiCat(r.categorie), groupeCat(r.categorie))}
          <div class="info"><div class="date">${ICONE_CAL}${dateCourte(d)}</div><div class="titre">${esc(r.libelle)}</div><div class="sous">${esc(r.categorie)}</div></div>
          <div class="droite"><div class="mt barre-txt">${eur(r.montant)}</div>
            <button class="ajout" onclick="event.stopPropagation();ajouterRecurrenteMaintenant(${r.ligne})">+ Ajouter</button></div>
        </div>`).join('')}
      ${liste.length ? liste.map(ligneTx).join('') : (aVenir.length ? '' : '<div class="vide">Aucune transaction ce mois-ci.<br>Touche + pour en ajouter une.</div>')}
    </section>
    ${liste.length > 2 ? '<div class="maj" style="margin-bottom:8px">Glisse une ligne vers la gauche pour la supprimer</div>' : ''}`;
}

// Une transaction (avec le geste « glisser pour supprimer »)
function ligneTx(r) {
  const rev = estRevenu(r);
  const badges = (r.s === 'Récurrente' ? '<span class="badge-mini etiq">↻</span>' : '')
    + (r.t ? `<span class="badge-mini etiq">🏷️ ${esc(r.t)}</span>` : '')
    + (r.qui ? `<span class="badge-mini remb ${r.remb ? 'ok' : ''}">💸 ${esc(r.qui)}</span>` : '');
  return `
    <div class="swipe" data-id="${esc(r.id)}"><div class="swipe-fond">Supprimer</div>
      <div class="tx clic" onclick="if(!gesteEnCours)ouvrirDepense(${attr(r.id)})">
        ${pastille(r.n, emojiDe(r), groupeDe(r))}
        <div class="info"><div class="date">${ICONE_CAL}${dateCourte(r.date)}</div>
          <div class="titre">${esc(r.n || r.c)}</div>
          <div class="sous">${r.n ? esc(r.c) : ''}${badges}</div></div>
        <div class="mt ${rev ? 'positif' : ''}">${rev ? '+' : '-'}${eur(r.m)}</div>
      </div></div>`;
}

/* ===== APERÇU (statistiques) ===== */
function vueApercu() {
  const tout = duMois(moisSel);
  const rs = tout.filter(r => !estRevenu(r));
  const total = somme(rs);
  const estMoisActuel = moisSel === cleMois(new Date());
  const jourMax = estMoisActuel ? new Date().getDate() : 31;
  const totalPrec = somme(depensesDuMois(decaler(moisSel, -1)).filter(r => r.date.getDate() <= jourMax));

  const parCat = {};
  rs.forEach(r => { parCat[r.c] = (parCat[r.c] || 0) + r.m; });
  const cats = Object.entries(parCat).sort((a, b) => b[1] - a[1]);
  const couleurCat = {};
  cats.forEach(([c], i) => { couleurCat[c] = i < PALETTE.length ? PALETTE[i] : '#94a3b8'; });
  const parGroupe = {};
  rs.forEach(r => { const g = groupeDe(r); parGroupe[g] = (parGroupe[g] || 0) + r.m; });
  const ordreGroupes = groupes().concat(Object.keys(parGroupe).filter(g => !groupes().includes(g))).filter(g => parGroupe[g]);
  const jours = estMoisActuel ? new Date().getDate() : dernierJour(dateDeCle(moisSel).getFullYear(), dateDeCle(moisSel).getMonth());
  const evol = totalPrec > 0 ? (total - totalPrec) / totalPrec : null;

  let html = `${carteMois()}
    <section class="card">
      <div class="resume">
        <div class="anneau">${anneau(cats, couleurCat, total)}
          <div class="centre"><span class="lbl">Dépenses</span><span class="val">${eur0(total)}</span></div></div>
        <div class="stats">
          <div class="stat"><div class="lbl">Dépenses</div><div class="val">${rs.length}</div></div>
          <div class="stat"><div class="lbl">Moyenne / jour</div><div class="val">${eur(total / Math.max(jours, 1))}</div></div>
          <div class="stat"><div class="lbl">vs ${nomMois(decaler(moisSel, -1), { month: 'long' })}${estMoisActuel ? ' au ' + jourMax : ''}</div>
            <div class="val">${evol === null ? '<span class="lbl">—</span>'
              : `<span class="badge ${evol > 0 ? 'up' : 'down'}">${evol > 0 ? '▲' : '▼'} ${Math.abs(evol * 100).toFixed(0)} %</span>`}</div></div>
        </div>
      </div>
      ${bilan3(tout)}
    </section>`;

  if (total > 0) {
    html += `
    <section class="card">
      <h2>Par groupe</h2>
      <div class="barre">${ordreGroupes.map(g => `<span style="width:${parGroupe[g] / total * 100}%;background:${couleurGroupe(g)}"></span>`).join('')}</div>
      <div class="legende">${ordreGroupes.map(g => `<span><i style="background:${couleurGroupe(g)}"></i>${esc(g)}<b>${eur0(parGroupe[g])}</b></span>`).join('')}</div>
    </section>
    <section class="card">
      <h2>Par catégorie</h2>
      ${cats.map(([c, v]) => {
        const b = (categorie(c) || {}).budget;
        return `
        <div class="ligne clic cat" onclick="voirCategorieDansListe(${attr(c)})">
          <div class="ico" style="background:color-mix(in srgb, ${couleurCat[c]} 20%, var(--card))">${esc(emojiCat(c))}</div>
          <div class="info"><div class="nom">${esc(c)}</div>
            <div class="jauge"><span style="width:${v / cats[0][1] * 100}%;background:${couleurCat[c]}"></span></div></div>
          <div class="mt">${eur(v)}<small>${(v / total * 100).toFixed(0)} %${b ? ' · ' + Math.round(v / b * 100) + ' % budget' : ''}</small></div>
        </div>`;
      }).join('')}
    </section>`;
  }
  html += carteCalendrier(rs) + carteEvenements();
  const tops = topCommerces(rs);
  if (tops.length) {
    html += `<section class="card"><h2>Top commerces</h2>
      ${tops.map((t, i) => `
        <div class="ligne"><div class="rang">${i + 1}</div>
          ${pastille(t.exemple.n, emojiDe(t.exemple), groupeDe(t.exemple), 'ico')}
          <div class="info"><div class="nom">${esc(t.nom)}</div><div class="sous">${t.nb} fois</div></div>
          <div class="mt">${eur(t.total)}</div></div>`).join('')}</section>`;
  }
  html += `<section class="card"><h2>6 derniers mois</h2>${histo()}</section>`;
  return html;
}

function voirCategorieDansListe(c) { catFiltre = c; jourFiltre = null; sousOnglets.accueil = 'liste'; render(); document.getElementById('contenu').scrollTop = 0; }

function anneau(cats, couleurCat, total) {
  const r = 58, C = 2 * Math.PI * r, ep = 16;
  if (!total) return `<svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--card2)" stroke-width="${ep}"/></svg>`;
  let off = 0, arcs = '';
  const ecart = cats.length > 1 ? 2 : 0;
  cats.forEach(([c, v]) => {
    const len = v / total * C;
    arcs += `<circle cx="70" cy="70" r="${r}" fill="none" stroke="${couleurCat[c]}" stroke-width="${ep}"
      stroke-dasharray="${Math.max(len - ecart, 0.5)} ${C}" stroke-dashoffset="${-off}"/>`;
    off += len;
  });
  return `<svg viewBox="0 0 140 140">${arcs}</svg>`;
}

function histo() {
  const mois = [];
  for (let i = 5; i >= 0; i--) mois.push(decaler(moisSel, -i));
  const max = Math.max(...mois.map(k => somme(depensesDuMois(k))), 1);
  return `<div class="histo">${mois.map(k => {
    const v = somme(depensesDuMois(k));
    return `<div class="col ${k === moisSel ? 'sel' : ''}" onclick="allerMois('${k}')">
      <div class="v">${v ? eur0(v) : ''}</div><div class="b" style="height:${v / max * 85}%"></div>
      <div class="m">${nomMois(k, { month: 'short' }).replace('.', '')}</div></div>`;
  }).join('')}</div>`;
}

function topCommerces(rs) {
  const g = {};
  rs.forEach(r => {
    const co = commerce(r.n);
    const cle = co ? co.nom : sansAccents(r.n);
    if (!cle) return;
    if (!g[cle]) g[cle] = { nom: co ? co.nom : majuscule(r.n.trim()), nb: 0, total: 0, exemple: r };
    g[cle].nb++; g[cle].total += r.m;
  });
  return Object.values(g).sort((a, b) => b.total - a.total).slice(0, 5);
}

function carteCalendrier(rs) {
  const debut = dateDeCle(moisSel);
  const nbJours = dernierJour(debut.getFullYear(), debut.getMonth());
  const parJour = {};
  rs.forEach(r => { const j = r.date.getDate(); parJour[j] = (parJour[j] || 0) + r.m; });
  const max = Math.max(0, ...Object.values(parJour));
  const decalage = (debut.getDay() + 6) % 7;
  const auj = new Date();
  const niveau = v => !v ? 0 : Math.min(5, Math.ceil(v / max * 5));
  const fond = n => n ? `color-mix(in srgb, var(--accent) ${12 + n * 17}%, var(--card2))` : 'var(--card2)';
  let cases = ['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(j => `<div class="js">${j}</div>`).join('');
  for (let i = 0; i < decalage; i++) cases += '<div></div>';
  for (let j = 1; j <= nbJours; j++) {
    const d = new Date(debut.getFullYear(), debut.getMonth(), j);
    const v = parJour[j] || 0;
    cases += `<button class="${memeJour(d, auj) ? 'auj' : ''}" ${d > auj ? 'disabled' : ''}
      style="background:${fond(niveau(v))};${niveau(v) >= 4 ? 'color:#fff' : ''}" onclick="choisirJourCal(${j})"
      aria-label="${j} : ${v ? eur(v) : 'rien'}">${j}</button>`;
  }
  return `<section class="card"><h2>Calendrier</h2><div class="cal">${cases}</div>
    <div class="cal-legende">moins ${[0, 1, 2, 3, 4, 5].map(n => `<i style="background:${fond(n)}"></i>`).join('')} plus</div></section>`;
}
function choisirJourCal(j) { jourFiltre = j; catFiltre = null; sousOnglets.accueil = 'liste'; render(); document.getElementById('contenu').scrollTop = 0; }

function etiquettes() {
  const g = {};
  depenses.filter(r => r.t && !estRevenu(r)).forEach(r => {
    const e = g[r.t] = g[r.t] || { nom: r.t, total: 0, nb: 0, debut: r.date, fin: r.date };
    e.total += r.m; e.nb++;
    if (r.date < e.debut) e.debut = r.date;
    if (r.date > e.fin) e.fin = r.date;
  });
  return Object.values(g).sort((a, b) => b.fin - a.fin);
}
function carteEvenements() {
  const es = etiquettes().slice(0, 3);
  if (!es.length) return '';
  const jour = d => d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
  return `<section class="card"><h2>Événements</h2>
    ${es.map(e => `<div class="ligne clic" onclick="ouvrirRecherche(${attr(e.nom)})">
      <div class="ico">🏷️</div>
      <div class="info"><div class="nom">${esc(e.nom)}</div><div class="sous">${e.nb} dépense${e.nb > 1 ? 's' : ''} · ${memeJour(e.debut, e.fin) ? jour(e.debut) : jour(e.debut) + ' → ' + jour(e.fin)}</div></div>
      <div class="mt">${eur(e.total)}</div></div>`).join('')}</section>`;
}

/* ===== BUDGET ===== */
function vueBudget() {
  const parCat = {};
  depensesDuMois(moisSel).forEach(r => { parCat[r.c] = (parCat[r.c] || 0) + r.m; });
  const estMoisActuel = moisSel === cleMois(new Date());
  const avecBudget = categoriesActives().filter(c => c.budget > 0 && c.groupe !== GROUPE_REVENUS)
    .map(c => ({ c, depense: parCat[c.nom] || 0 }))
    .sort((a, b) => b.depense / b.c.budget - a.depense / a.c.budget);
  const sansBudget = Object.keys(parCat).filter(n => !avecBudget.some(x => x.c.nom === n));
  if (!avecBudget.length) return carteMois() + `<section class="card"><div class="vide">Aucun budget défini.<br>
    <button class="puce" style="margin-top:12px" onclick="changerOnglet('outils','categories')">Définir mes budgets</button></div></section>`;
  const totalBudget = avecBudget.reduce((s, x) => s + x.c.budget, 0);
  const totalDepense = avecBudget.reduce((s, x) => s + x.depense, 0);
  const reste = totalBudget - totalDepense;

const estDue = (rec, mois1) => { const n = rec.frequence || 1; return ((mois1 - (rec.moisDepart || 1)) % n + n) % n === 0; };
function prochaineDate(rec) {
  if (!rec.actif) return null;
  const auj = new Date(); auj.setHours(0, 0, 0, 0);
  for (let i = 0; i < 25; i++) {
    const d = new Date(auj.getFullYear(), auj.getMonth() + i, 1);
    if (!estDue(rec, d.getMonth() + 1)) continue;
    if (i === 0 && rec.dernierAjout === cleMois(d)) continue;
    d.setDate(Math.min(rec.jour, dernierJour(d.getFullYear(), d.getMonth())));
    if (i === 0 && d < auj) return auj;
    return d;
  }
  return null;
}
function aVenirCeMois() {
  const auj = new Date();
  return recurrentes.map(r => ({ r, d: prochaineDate(r) }))
    .filter(x => x.d && x.d.getMonth() === auj.getMonth() && x.d.getFullYear() === auj.getFullYear())
    .sort((a, b) => b.d - a.d);
}
function libellePeriode(rec) {
  const j = rec.jour === 1 ? '1er' : rec.jour;
  const f = rec.frequence || 1;
  if (f === 1) return `Chaque mois le ${j}`;
  if (f === 12) return `Chaque année le ${j} ${NOMS_MOIS[rec.moisDepart - 1]}`;
  const mois = [];
  for (let m = rec.moisDepart; mois.length < 12 / f; m += f) mois.push(new Date(2026, (m - 1) % 12, 1).toLocaleDateString('fr-FR', { month: 'short' }));
  return `Tous les ${f} mois le ${j} (${mois.join(', ')})`;
}
function ajouterRecurrenteMaintenant(ligne) {
  const r = recurrentes.find(x => x.ligne === ligne);
  if (!r) return;
  const maintenant = new Date();
  ecrire('ajouterRecurrenteMaintenant', [ligne], () => {
    r.dernierAjout = cleMois(maintenant);
    depenses = depenses.concat({ id: 'tmp-' + Date.now(), d: versTexteDate(maintenant), date: maintenant, m: r.montant, c: r.categorie,
      n: r.libelle, s: 'Récurrente', g: groupeCat(r.categorie), e: emojiCat(r.categorie), t: '', qui: '', du: 0, remb: false });
  }, `✅ ${r.libelle} ajouté`);
}
function vueRecurrentes() {
  const actives = recurrentes.filter(r => r.actif);
  const parMois = actives.reduce((s, r) => s + r.montant / (r.frequence || 1), 0);
  const tri = recurrentes.slice().sort((a, b) => {
    const da = prochaineDate(a), db = prochaineDate(b);
    if (!da || !db) return da ? -1 : db ? 1 : 0;
    return da - db;
  });
  return `
    <section class="card">
      <div class="lbl">Coût moyen par mois</div>
      <div style="font-size:30px;font-weight:800;letter-spacing:-.02em">${eur(parMois)}</div>
      <div class="lbl">${actives.length} active${actives.length > 1 ? 's' : ''} · ${eur0(parMois * 12)} par an</div>
    </section>
    <section class="card">
      ${tri.length ? tri.map(r => {
        const d = prochaineDate(r);
        return `<div class="ligne" style="${r.actif ? '' : 'opacity:.5'}">
          <div class="clic" style="flex:1;min-width:0;display:flex;align-items:center;gap:12px" onclick="ouvrirRecurrente(${r.ligne})">
            ${pastille(r.libelle, emojiCat(r.categorie), groupeCat(r.categorie), 'ico')}
            <div class="info"><div class="nom" style="white-space:normal">${esc(r.libelle)}</div>
              <div class="sous" style="white-space:normal">${esc(libellePeriode(r))}</div>
              <div class="sous">${d ? 'Prochaine : ' + d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' }) : 'En pause'}</div></div>
            <div class="mt">${eur(r.montant)}</div></div>
          <label class="switch"><input type="checkbox" ${r.actif ? 'checked' : ''} onchange="basculerRecurrente(${r.ligne}, this.checked)"><i></i></label>
        </div>`;
      }).join('') : '<div class="vide">Aucune dépense récurrente.<br>Touche + pour en ajouter une.</div>'}
    </section>
    <div class="maj" style="margin-bottom:6px">Changer un prix ne modifie pas les mois déjà passés.</div>`;
}
function basculerRecurrente(ligne, actif) {
  const r = recurrentes.find(x => x.ligne === ligne);

/* ===== Glisser pour supprimer (Annuler pendant 5 s) ===== */
let gesteEnCours = false;
(function () {
  let el = null, x0 = 0, y0 = 0, dx = 0, sens = null;
  document.addEventListener('pointerdown', e => {
    const s = e.target.closest('.swipe');
    if (!s || !e.isPrimary || el || feuilleOuverte()) return;
    el = s; x0 = e.clientX; y0 = e.clientY; dx = 0; sens = null;
  });
  document.addEventListener('pointermove', e => {
    if (!el) return;
    const ddx = e.clientX - x0, ddy = e.clientY - y0;
    if (!sens && (Math.abs(ddx) > 8 || Math.abs(ddy) > 8)) sens = Math.abs(ddx) > Math.abs(ddy) ? 'h' : 'v';
    if (sens !== 'h') return;
    gesteEnCours = true;
    dx = Math.min(0, ddx);
    const ligne = el.querySelector('.tx');
    ligne.style.transition = 'none';
    ligne.style.transform = `translateX(${dx}px)`;
    el.querySelector('.swipe-fond').style.opacity = Math.min(1, -dx / 80);
  });
  const fin = () => {
    if (!el) return;
    const s = el, ligne = s.querySelector('.tx');
    ligne.style.transition = '';
    if (sens === 'h' && -dx > s.offsetWidth * 0.4) {
      ligne.style.transform = 'translateX(-110%)';
      setTimeout(() => supprimerAvecAnnuler(s.dataset.id), 180);
    } else {
      ligne.style.transform = '';
      s.querySelector('.swipe-fond').style.opacity = 0;
    }
    el = null;
    setTimeout(() => { gesteEnCours = false; }, 50);
  };
  document.addEventListener('pointerup', fin);
  document.addEventListener('pointercancel', fin);
})();

function supprimerAvecAnnuler(id) {
  const r = depenses.find(x => x.id === id);
  if (!r || enAttenteSuppression[id]) return;
  depenses = depenses.filter(x => x.id !== id);
  render();
  // Le jeton garantit qu'une suppression annulée n'est jamais envoyée
  const jeton = {};
  jeton.minuteur = setTimeout(() => {
    if (enAttenteSuppression[id] !== jeton) return;
    delete enAttenteSuppression[id];
    ecrire('supprimerDepense', [id]);
  }, 5000);
  enAttenteSuppression[id] = jeton;
  toast(`🗑 ${r.n || r.c} · ${eur(r.m)} supprimé`, { texte: 'Annuler', fn: () => {
    if (enAttenteSuppression[id] !== jeton) return;
    clearTimeout(jeton.minuteur); delete enAttenteSuppression[id];
    depenses = depenses.concat(r); render(); toast('↩︎ Restauré');
  } }, 5000);
}

function libelleJour(d) {
  const auj = new Date(), hier = new Date(); hier.setDate(hier.getDate() - 1);
  if (memeJour(d, auj)) return "Aujourd'hui";
  if (memeJour(d, hier)) return 'Hier';
  return d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'long' });
}
function navDate(f) {
  const dateIso = `${f.date.getFullYear()}-${deux(f.date.getMonth() + 1)}-${deux(f.date.getDate())}`;
  return `<div class="champ"><span class="ic">🗓️</span>
    <div class="date-nav">
      <button onclick="decalerJour(-1)" aria-label="Jour précédent">‹</button>
      <label>${esc(libelleJour(f.date))}<input type="date" value="${dateIso}" max="${versTexteDate(new Date()).slice(0, 10)}" onchange="choisirJour(this.value)"></label>
      <button onclick="decalerJour(1)" ${memeJour(f.date, new Date()) ? 'disabled style="opacity:.25"' : ''} aria-label="Jour suivant">›</button>
    </div></div>`;
}
function decalerJour(n) { const d = new Date(feuilleEtat.date); d.setDate(d.getDate() + n); if (d > new Date()) return; majFeuille({ date: d }); }
function choisirJour(v) { if (!v) return; const [a, m, j] = v.split('-').map(Number); const d = new Date(feuilleEtat.date); d.setFullYear(a, m - 1, j); majFeuille({ date: d }); }
function grilleCategories(sel, actionJs, filtre) {
  const actives = categoriesActives().filter(c => !filtre || filtre(c));
  if (sel && !actives.some(c => c.nom === sel)) actives.push({ nom: sel, groupe: groupeCat(sel), emoji: emojiCat(sel) });
  const gs = groupes().filter(g => actives.some(c => c.groupe === g));
  actives.filter(c => !gs.includes(c.groupe)).forEach(c => gs.push(c.groupe));
  if (!actives.length) return '<div class="aide" style="margin-left:0">Aucune catégorie. Crée-en une dans Outils.</div>';
  return `<div class="grille-cats">${gs.map(g => `<h4>${esc(g)}</h4>
    <div class="grille">${actives.filter(c => c.groupe === g).sort(parNom).map(c =>
      `<button class="${c.nom === sel ? 'sel' : ''}" onclick="${actionJs}(${attr(c.nom)})">${esc(c.emoji || '•')} ${esc(c.nom)}</button>`).join('')}</div>`).join('')}</div>`;
}

// Le champ du montant prend la largeur du nombre, pour que « € » reste collé (comme Buddy)
function ajusterLargeurMontant() {
  const i = document.querySelector('#feuille .saisie-montant input');
  if (!i) return;
  const mesure = document.createElement('span');
  mesure.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;font-size:60px;font-weight:300';
  mesure.textContent = i.value || '0';
  document.body.appendChild(mesure);
  i.style.width = (mesure.getBoundingClientRect().width + 4) + 'px';
  mesure.remove();
}

/* ===== Choix de catégorie (grille de bulles, façon Buddy) ===== */
function ouvrirChoixCategorie() {
  lireChamps();
  feuilleEtat = { type: 'choixCat', retour: feuilleEtat, recherche: '' };
  dessinerFeuille();
}
function categoriesPlusUtilisees(revenu) {
  const limite = Date.now() - 90 * 24 * 3600 * 1000, n = {};
  depenses.forEach(r => { if (r.date.getTime() >= limite && estRevenu(r) === revenu) n[r.c] = (n[r.c] || 0) + 1; });
  return Object.keys(n).filter(c => categorie(c) && categorie(c).active).sort((a, b) => n[b] - n[a]).slice(0, 8);
}
function feuilleChoixCat(f) {
  const revenu = !!f.retour.revenu;
  const filtre = c => c.active && (revenu ? c.groupe === GROUPE_REVENUS : c.groupe !== GROUPE_REVENUS);
  const mots = sansAccents(f.recherche).split(' ').filter(Boolean);
  const correspondCat = c => mots.every(m => sansAccents(c.nom + ' ' + c.groupe).includes(m));
  const bulle = c => `<button onclick="choisirCategorie(${attr(c.nom)})">
      <div class="bulle ${c.nom === f.retour.categorie ? 'sel' : ''}" style="background:color-mix(in srgb, ${couleurGroupe(c.groupe)} 24%, var(--card))">${esc(c.emoji || '•')}</div>
      <span>${esc(c.nom)}</span></button>`;
  const actives = categories.filter(filtre).filter(correspondCat);
  const plus = mots.length ? [] : categoriesPlusUtilisees(revenu).map(categorie);
  const gs = groupes().filter(g => actives.some(c => c.groupe === g));
  return `
    <div class="choix-tete">
      <button class="rond" onclick="retourChoix()" aria-label="Retour" style="display:flex;align-items:center;justify-content:center">${IC.croix.replace('<svg', '<svg width="22" height="22"')}</button>
      <h3>Catégories</h3>
      <div class="pilule"><button onclick="fermerFeuille();changerOnglet('outils','categories')" aria-label="Modifier les catégories">${IC.crayon}</button>
        <button onclick="fermerFeuille();setTimeout(()=>ouvrirCategorie(null),260)" aria-label="Nouvelle catégorie">${IC.plus}</button></div>
    </div>
    <div class="choix-corps">
      ${plus.length ? `<div class="choix-groupe">Plus utilisées</div><div class="choix-grille">${plus.map(bulle).join('')}</div>` : ''}
      ${gs.map(g => `<div class="choix-groupe">${esc(g)}</div>
        <div class="choix-grille">${actives.filter(c => c.groupe === g).sort(parNom).map(bulle).join('')}</div>`).join('')}
      ${!actives.length ? '<div class="vide">Aucune catégorie trouvée</div>' : ''}
    </div>
    <div class="choix-recherche">${IC.loupe}<input id="cherche-cat" type="search" placeholder="Recherche" value="${esc(f.recherche)}"
      oninput="filtrerChoix(this.value)"></div>`;
}
function filtrerChoix(v) {
  feuilleEtat.recherche = v;
  dessinerFeuille();
  const i = document.getElementById('cherche-cat');
  i.focus(); i.setSelectionRange(i.value.length, i.value.length);
}
function choisirCategorie(nom) {
  const retour = feuilleEtat.retour;
  retour.categorie = nom;
  feuilleEtat = retour;
  dessinerFeuille();
}
function retourChoix() { feuilleEtat = feuilleEtat.retour; dessinerFeuille(); }
function choisirCatDepense(nom) { majFeuille({ categorie: nom }); }
function basculerRemboursement(oui) {
  lireChamps();
  const m = lireMontant(feuilleEtat.montant);
  majFeuille({ aRembourser: oui, du: oui && !feuilleEtat.du && m ? montantTexte(Math.round(m / 2 * 100) / 100) : feuilleEtat.du });
}
function partager(n) {
  lireChamps();
  const m = lireMontant(feuilleEtat.montant);
  if (!m) return toast("Indique d'abord le montant");
  majFeuille({ du: montantTexte(Math.round(m / n * 100) / 100) });
}
function validerDepense() {
  lireChamps();
  const f = feuilleEtat;
  const m = lireMontant(f.montant);
  if (!m) return toast('Indique un montant');
  if (!f.categorie) return toast('Choisis une catégorie');
  const qui = f.aRembourser && !f.revenu ? String(f.qui || '').trim() : '';
  const du = qui ? lireMontant(f.du) : 0;
  if (f.aRembourser && !f.revenu && !qui) return toast('Indique qui doit te rembourser');
  if (qui && !du) return toast('Indique le montant dû');
  const d = new Date(f.date);
  if (f.nouvelle && !memeJour(d, new Date())) d.setHours(12, 0, 0, 0);
  const envoi = { id: f.id, date: versTexteDate(d), montant: m, categorie: f.categorie, note: (f.note || '').trim(),
    etiquette: String(f.etiquette || '').trim(), qui, du, rembourse: qui ? !!f.remb : false };
  const ancienne = depenses.find(x => x.id === f.id) || {};
  const changeCat = !f.nouvelle && ancienne.c !== f.categorie;
  const locale = { id: f.id || 'tmp-' + Date.now(), d: envoi.date, date: d, m, c: f.categorie, n: envoi.note,
    s: f.nouvelle ? 'Appli' : ancienne.s,
    g: f.nouvelle || changeCat ? groupeCat(f.categorie) : ancienne.g,   // historique figé
    e: f.nouvelle || changeCat ? emojiCat(f.categorie) : ancienne.e,
    t: envoi.etiquette, qui, du, remb: envoi.rembourse };
  const nouvelle = f.nouvelle;
  const repeter = nouvelle && !f.revenu ? Number(f.repeter) || 0 : 0;
  moisSel = cleMois(d);
  if (nouvelle) { onglet = onglet === 'dettes' ? 'dettes' : 'accueil'; if (onglet === 'accueil') sousOnglets.accueil = 'liste'; }
  feuilleEtat = null; fermerFeuille();
  ecrire('enregistrerDepense', [envoi], () => {
    depenses = nouvelle ? depenses.concat(locale) : depenses.map(x => x.id === f.id ? locale : x);
  }, nouvelle ? (f.revenu ? '✅ Revenu ajouté' : '✅ Dépense ajoutée') : '✅ Modifié');
  if (repeter) {
    const rec = { libelle: envoi.note || envoi.categorie, montant: m, categorie: envoi.categorie, jour: d.getDate(),
      frequence: repeter, moisDepart: d.getMonth() + 1, actif: true, dejaAjoute: cleMois(d) === cleMois(new Date()) };
    ecrire('enregistrerRecurrente', [rec], () => {
      recurrentes = recurrentes.concat({ ...rec, ligne: -Date.now(), dernierAjout: rec.dejaAjoute ? cleMois(d) : '' });
    }, '🔁 Ajoutée aux récurrentes');
  }
}
function supprimerDepenseUI() {
  const id = feuilleEtat.id;
  confirmer('Supprimer cette transaction ?', 'Elle sera retirée du Google Sheet.', 'Supprimer').then(oui => {
    if (!oui) return ouvrirDepense(id);
    ecrire('supprimerDepense', [id], () => { depenses = depenses.filter(x => x.id !== id); }, '🗑 Supprimé');
  });
}

    <div class="champ clic" onclick="ouvrirChoixCategorie()"><span class="ic">${f.categorie ? esc(emojiCat(f.categorie)) : '🗂️'}</span>
      <span class="etiq">Catégorie : <b style="color:var(--txt)">${f.categorie ? esc(f.categorie) : 'à choisir'}</b></span><span class="lbl" style="font-size:20px">›</span></div>
    <button class="btn principal" onclick="validerRecurrente()">ENREGISTRER</button>
    ${f.nouvelle ? '' : '<button class="btn danger" onclick="supprimerRecurrenteUI()">Supprimer</button>'}`;
}
function choisirCatRecurrente(nom) { majFeuille({ categorie: nom }); }
function validerRecurrente() {
  lireChamps();
  const f = feuilleEtat;
  const m = lireMontant(f.montant);
  if (!m) return toast('Indique un montant');
  if (!String(f.libelle || '').trim()) return toast('Donne-lui un nom');
  if (!f.categorie) return toast('Choisis une catégorie');
  const jour = Math.min(Math.max(parseInt(f.jour, 10) || 1, 1), 31);
  const envoi = { ligne: f.ligne, libelle: f.libelle.trim(), montant: m, categorie: f.categorie, jour,
    frequence: Number(f.frequence), moisDepart: Number(f.moisDepart) || 1, actif: !!f.actif };
  const nouvelle = f.nouvelle;
  feuilleEtat = null; fermerFeuille();
  ecrire('enregistrerRecurrente', [envoi], () => {
    if (nouvelle) recurrentes = recurrentes.concat({ ...envoi, ligne: -Date.now(), dernierAjout: '' });
    else recurrentes = recurrentes.map(x => x.ligne === envoi.ligne ? { ...x, ...envoi } : x);
  }, nouvelle ? '✅ Récurrente ajoutée' : '✅ Modifiée');
}
function supprimerRecurrenteUI() {
  const ligne = feuilleEtat.ligne, nom = feuilleEtat.libelle;
  confirmer(`Supprimer « ${nom} » ?`, 'Elle ne sera plus ajoutée. Les dépenses déjà enregistrées restent.', 'Supprimer').then(oui => {
    if (!oui) return ouvrirRecurrente(ligne);
    ecrire('supprimerRecurrente', [ligne], () => { recurrentes = recurrentes.filter(x => x.ligne !== ligne); }, '🗑 Supprimée');
  });
}

/* ===== Feuille : catégorie ===== */
function ouvrirCategorie(nom) {
  const c = nom ? categorie(nom) : null;
  const gs = groupes().filter(g => g !== GROUPE_REVENUS);
  ouvrirFeuille({ type: 'categorie', ancienNom: c ? c.nom : null, nom: c ? c.nom : (nom || ''), emoji: c ? c.emoji : '🛒',
    groupe: c ? c.groupe : (gs[0] || 'Dépenses plaisir'), nouveauGroupe: false, nouvelle: !c, budget: c && c.budget ? String(c.budget) : '' });
}
function feuilleCategorie(f) {
  return `${tete(f.nouvelle ? 'Nouvelle catégorie' : 'Modifier la catégorie')}
    <div id="apercu-emoji" style="width:90px;height:90px;border-radius:50%;margin:4px auto 10px;display:flex;align-items:center;justify-content:center;font-size:46px;
      background:color-mix(in srgb, ${couleurGroupe(f.groupe)} 20%, var(--card))">${esc(f.emoji || '•')}</div>
    <div class="champ"><span class="ic">✏️</span><input type="text" data-champ="nom" placeholder="Nom de la catégorie" value="${esc(f.nom)}"></div>
    <div class="champ"><span class="ic">😀</span><input type="text" data-champ="emoji" placeholder="Émoji (tape-le ou choisis)" value="${esc(f.emoji)}"
      oninput="feuilleEtat.emoji=this.value;document.getElementById('apercu-emoji').textContent=this.value||'•'"></div>
    <div class="emojis">${EMOJIS_PROPOSES.map(e => `<button class="${e === f.emoji ? 'sel' : ''}" onclick="majFeuille({emoji:${attr(e)}})">${e}</button>`).join('')}</div>
    <div class="champ" style="margin-top:14px"><span class="ic">📁</span><span class="etiq">Groupe</span></div>
    <div class="grille">${groupes().map(g => `<button class="${!f.nouveauGroupe && f.groupe === g ? 'sel' : ''}" onclick="majFeuille({groupe:${attr(g)},nouveauGroupe:false})">${esc(g)}</button>`).join('')}
      <button class="${f.nouveauGroupe ? 'sel' : ''}" onclick="majFeuille({nouveauGroupe:true,groupe:''})">＋ Nouveau groupe</button></div>
    ${f.nouveauGroupe ? `<div class="champ" style="margin-top:10px"><span class="ic">🆕</span><input type="text" data-champ="groupe" placeholder="Nom du groupe" value="${esc(f.groupe)}"></div>` : ''}
    ${f.groupe === GROUPE_REVENUS ? '' : `
    <div class="champ" style="margin-top:14px"><span class="ic">🎯</span><span class="etiq">Budget par mois</span>
      <input type="text" data-champ="budget" inputmode="numeric" placeholder="aucun" value="${esc(f.budget)}" style="flex:0 0 80px;text-align:right"><span>€</span></div>
    ${MOYENNES_2025[f.ancienNom || f.nom] ? `<div class="aide">Ta moyenne Buddy 2025 : ${eur0(MOYENNES_2025[f.ancienNom || f.nom])} par mois.
      <a href="#" onclick="event.preventDefault();majFeuille({budget:'${MOYENNES_2025[f.ancienNom || f.nom]}'})" style="color:var(--accent)">Utiliser</a></div>` : ''}`}
    ${f.nouvelle ? '' : '<div class="aide" style="margin-left:0;margin-top:12px">Tes dépenses passées gardent leur nom et leur groupe d\'origine.</div>'}
    <button class="btn principal" onclick="validerCategorie()">ENREGISTRER</button>
    ${f.nouvelle ? '' : `<button class="btn danger" onclick="fermerFeuille();demanderSuppressionCategorie(${attr(f.ancienNom)})">Supprimer</button>`}`;
}
function validerCategorie() {
  lireChamps();
  const f = feuilleEtat;
  const envoi = { ancienNom: f.ancienNom, nom: String(f.nom || '').trim(), groupe: String(f.groupe || '').trim(),
    emoji: String(f.emoji || '').trim() || '•', budget: Math.round(lireMontant(f.budget)) || '' };
  if (!envoi.nom) return toast('Donne-lui un nom');
  if (!envoi.groupe) return toast('Choisis un groupe');
  if (envoi.nom !== envoi.ancienNom && categorie(envoi.nom)) return toast('Ce nom existe déjà');
  const nouvelle = f.nouvelle;
  feuilleEtat = null; fermerFeuille();
  ecrire('enregistrerCategorie', [envoi], () => {
    const valeurs = { nom: envoi.nom, groupe: envoi.groupe, emoji: envoi.emoji, budget: Number(envoi.budget) || 0 };
    if (nouvelle) categories = categories.concat({ ...valeurs, active: true });
    else {
      categories = categories.map(c => c.nom === envoi.ancienNom ? { ...c, ...valeurs } : c);
      if (envoi.nom !== envoi.ancienNom) recurrentes.forEach(r => { if (r.categorie === envoi.ancienNom) r.categorie = envoi.nom; });
    }
  }, nouvelle ? '✅ Catégorie créée' : '✅ Enregistré');
}

/* ===== Feuille : renommer un groupe ===== */
function ouvrirGroupe(nom) { ouvrirFeuille({ type: 'groupe', ancien: nom, nom }); setTimeout(() => { const i = document.querySelector('#feuille input'); if (i) i.select(); }, 300); }
function feuilleGroupe(f) {
  const nb = categories.filter(c => c.groupe === f.ancien).length;
  return `${tete('Renommer le groupe')}
    <div class="champ" style="border-top:0"><span class="ic">✏️</span><input type="text" data-champ="nom" value="${esc(f.nom)}" placeholder="Nom du groupe"></div>
    <div class="aide">${nb} catégorie${nb > 1 ? 's' : ''} dans ce groupe. Tes dépenses passées gardent l'ancien nom de groupe.</div>
    <button class="btn principal" onclick="validerGroupe()">ENREGISTRER</button>`;
}
function validerGroupe() {
  lireChamps();
  const ancien = feuilleEtat.ancien, nouveau = String(feuilleEtat.nom || '').trim();
  if (!nouveau) return toast('Donne-lui un nom');
  if (nouveau === GROUPE_REVENUS) return toast('Ce nom est réservé aux revenus');
  feuilleEtat = null; fermerFeuille();
  if (nouveau === ancien) return;
  ecrire('renommerGroupe', [ancien, nouveau], () => {
    categories = categories.map(c => c.groupe === ancien ? { ...c, groupe: nouveau } : c);
  }, '✅ Groupe renommé');
}

/* ===== Feuille : confirmation ===== */
let confirmerResolu = null;
function confirmer(titre, texte, bouton) {
  return new Promise(ok => { confirmerResolu = ok; ouvrirFeuille({ type: 'confirmer', titre, texte, bouton }); });
}
function feuilleConfirmer(f) {
  return `<div style="text-align:center;padding:10px 4px 0">
      <div style="font-size:19px;font-weight:700;margin-bottom:6px">${esc(f.titre)}</div>
      <div class="lbl" style="font-size:14px">${esc(f.texte)}</div></div>
    <button class="btn principal" style="background:var(--danger);color:#fff" onclick="repondreConfirmer(true)">${esc(f.bouton).toUpperCase()}</button>
    <button class="btn danger" style="color:var(--txt)" onclick="repondreConfirmer(false)">Annuler</button>`;
}
function repondreConfirmer(oui) {
  const r = confirmerResolu; confirmerResolu = null;
  feuilleEtat = null; fermerFeuille();
  if (r) setTimeout(() => r(oui), oui ? 0 : 260);
}

/* ---------- Navigation ---------- */
function changerMois(n) { moisSel = decaler(moisSel, n); catFiltre = null; jourFiltre = null; render(); document.getElementById('contenu').scrollTop = 0; }
function allerMois(k) { if (k > cleMois(new Date())) return; moisSel = k; catFiltre = null; jourFiltre = null; render(); }
function rafraichir() { synchro = true; render(); charger(); }

// Resynchronise au retour sur l'appli et toutes les minutes (sauf pendant une saisie ou une écriture)
let dernierTic = Date.now();
function rafraichirSiAncien() {
  if (!charge || feuilleOuverte() || rechercheActive || ecrituresEnCours) return;
  if (Date.now() - dernierChargement > 3000) charger();
}
setInterval(() => {
  const maintenant = Date.now();
  const retour = maintenant - dernierTic > 6000;
  dernierTic = maintenant;
  if (retour || maintenant - dernierChargement > 60000) rafraichirSiAncien();
}, 2000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') rafraichirSiAncien(); });
window.addEventListener('focus', rafraichirSiAncien);
window.addEventListener('pageshow', rafraichirSiAncien);

/* ---------- Démo (?demo) : données fictives, rien n'est envoyé ---------- */
const DEMO = (function () {
  const def = [
    ['Dépenses plaisir', ['Abonnements', 'Appartement Déco', 'Bars / Soirées', 'Bien être et compléments santé', 'Bouffe / Goûter / Café', 'Dépenses diverses', 'Plaisir d’offrir / Cadeaux', 'Voyage', 'Vêtements']],
    ['Dépenses professionnelles', ['Revolut : Dépenses pro']],
    ['Dépenses contraintes', ['Assurance voiture', 'Courses', 'Covoit', 'Essence', 'Forfait mobile', 'Frais de voiture', 'Impôts', 'Internet', 'Loyer', 'Métro/train', 'Parking', 'Santé', 'Énergie - électricité']],
    ['Revenus', ['Salaire', 'Aides', 'Autres revenus']],
  ];
  let cats = [];
  def.forEach(([g, noms]) => noms.forEach(nom => cats.push({ nom, groupe: g, emoji: EMOJI[nom] || '•', active: true, budget: Math.round((MOYENNES_2025[nom] || 0) / 5) * 5 })));
  const depensables = cats.filter(c => c.groupe !== 'Revenus').map(c => c.nom);
  const notes = ['Mc do', 'BK', 'Courses Leclerc', '', 'Boulangerie', 'Café avec Maël', 'Subway', '', 'EDF', 'Zara', 'Uber', 'Loto', 'Bière Le QG'];
  let deps = [], n = 0, seed = 7;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const now = new Date();
  const grp = nom => (cats.find(c => c.nom === nom) || {}).groupe || '';
  const emo = nom => (cats.find(c => c.nom === nom) || {}).emoji || '';
  for (let i = 0; i < 160; i++) {
    const d = new Date(now); d.setDate(d.getDate() - Math.floor(rnd() * 170)); d.setHours(8 + Math.floor(rnd() * 14));
    const c = depensables[Math.floor(Math.pow(rnd(), 1.8) * depensables.length)];
    deps.push({ id: 'd' + (n++), d: versTexteDate(d), m: Math.round((3 + rnd() * (c === 'Loyer' ? 600 : 60)) * 100) / 100, c,
      n: notes[Math.floor(rnd() * notes.length)], s: 'iPhone', g: grp(c), e: emo(c), t: '', qui: '', du: 0, remb: false });
  }
  for (let k = 0; k < 6; k++) deps.push({ id: 'd' + (n++), d: versTexteDate(new Date(now.getFullYear(), now.getMonth() - k, 1, 9)), m: 1650, c: 'Salaire', n: 'Salaire', s: 'Appli', g: 'Revenus', e: '💶', t: '', qui: '', du: 0, remb: false });
  deps.slice(0, 5).forEach(r => { r.t = 'Ski 2027'; });
  deps.slice(10, 12).forEach(r => { r.qui = 'Océane'; r.du = Math.round(r.m / 2 * 100) / 100; });
  let dets = [{ id: 'x1', d: versTexteDate(new Date(now.getFullYear(), now.getMonth(), 2, 20)), sens: 'Je dois', qui: 'Axel', m: 18, n: 'Places de cinéma', regle: false }];
  const moisCourant = cleMois(now);
  let recs = [
    ['Sosh (forfait mobile)', 9.99, 'Abonnements', 27, true, '', 1, 10], ['Dashlane (split)', 1.75, 'Abonnements', 12, true, '', 1, 10],
    ['Apple iCloud 50 Go', 0.99, 'Abonnements', 28, true, '', 1, 10], ['Claude', 21.6, 'Abonnements', 9, true, moisCourant, 1, 10],
    ['YouTube Premium (split)', 6.24, 'Abonnements', 28, true, '', 1, 10], ['Assurance voiture', 320, 'Assurance voiture', 5, true, '', 12, 3],
  ].map((l, i) => ({ ligne: i + 2, libelle: l[0], montant: l[1], categorie: l[2], jour: l[3], actif: l[4], dernierAjout: l[5], frequence: l[6], moisDepart: l[7] }));
  const nouvelId = () => 'd' + (n++);
  return {
    getTout: () => JSON.parse(JSON.stringify({ depenses: deps, categories: cats, recurrentes: recs, dettes: dets })),
    enregistrerDepense: x => {
      const extra = { t: x.etiquette || '', qui: x.qui || '', du: x.du || 0, remb: !!x.rembourse };
      if (x.id) {
        const r = deps.find(r => r.id === x.id);
        if (r.c !== x.categorie) Object.assign(r, { g: grp(x.categorie), e: emo(x.categorie) });
        Object.assign(r, { d: x.date, m: x.montant, c: x.categorie, n: x.note }, extra); return x.id;
      }
      const id = nouvelId(); deps.push({ id, d: x.date, m: x.montant, c: x.categorie, n: x.note, s: 'Appli', g: grp(x.categorie), e: emo(x.categorie), ...extra }); return id;
    },
    supprimerDepense: id => { deps = deps.filter(r => r.id !== id); },
    marquerRembourse: (id, oui) => { deps.find(r => r.id === id).remb = oui; },
    enregistrerCategorie: x => {
      if (x.ancienNom) {
        Object.assign(cats.find(c => c.nom === x.ancienNom), { nom: x.nom, groupe: x.groupe, emoji: x.emoji, budget: Number(x.budget) || 0 });
        recs.forEach(r => { if (r.categorie === x.ancienNom) r.categorie = x.nom; }); // les dépenses passées ne changent pas
      } else cats.push({ nom: x.nom, groupe: x.groupe, emoji: x.emoji, active: true, budget: Number(x.budget) || 0 });
    },
    supprimerCategorie: nom => { cats.find(c => c.nom === nom).active = false; },
    restaurerCategorie: nom => { cats.find(c => c.nom === nom).active = true; },
    renommerGroupe: (a, b) => { cats.forEach(c => { if (c.groupe === a) c.groupe = b; }); },
    enregistrerRecurrente: x => {
      if (x.ligne > 0) Object.assign(recs.find(r => r.ligne === x.ligne), x);
      else recs.push({ ...x, ligne: Math.max(1, ...recs.map(r => r.ligne)) + 1, dernierAjout: x.dejaAjoute ? moisCourant : '' });
    },
    supprimerRecurrente: ligne => { recs = recs.filter(r => r.ligne !== ligne).map(r => r.ligne > ligne ? { ...r, ligne: r.ligne - 1 } : r); },
    ajouterRecurrenteMaintenant: ligne => {
      const r = recs.find(x => x.ligne === ligne); r.dernierAjout = moisCourant;
      deps.push({ id: nouvelId(), d: versTexteDate(new Date()), m: r.montant, c: r.categorie, n: r.libelle, s: 'Récurrente', g: grp(r.categorie), e: emo(r.categorie), t: '', qui: '', du: 0, remb: false });
    },
    enregistrerDette: x => {
      const v = { d: x.date, sens: x.sens, qui: x.qui, m: x.montant, n: x.note, regle: !!x.regle };
      if (x.id) { Object.assign(dets.find(d => d.id === x.id), v); return x.id; }
      const id = 'x' + (n++); dets.push({ id, ...v }); return id;
    },
    reglerDette: (id, oui) => { dets.find(d => d.id === id).regle = oui; },
    supprimerDette: id => { dets = dets.filter(d => d.id !== id); },
  };
})();

/* ---------- Démarrage ---------- */
// En mode appli (écran d'accueil), certains iPhone annoncent une hauteur trop courte : on prend celle de l'écran
function ajusterHauteur() {
  const appliIos = navigator.standalone === true;
  const portrait = innerHeight > innerWidth;
  const h = appliIos && portrait ? Math.max(innerHeight, screen.height) : innerHeight;
  document.documentElement.style.setProperty('--h', h + 'px');
}
ajusterHauteur();
addEventListener('resize', ajusterHauteur);
addEventListener('orientationchange', () => setTimeout(ajusterHauteur, 300));
if ('serviceWorker' in navigator && !MODE_DEMO && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist && lireCode()) navigator.storage.persist().catch(() => {});
if (!MODE_DEMO && !lireCode()) afficherConnexion();
else { chargerCache(); charger(); }
</script>
