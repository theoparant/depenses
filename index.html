<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dépenses">
<meta name="theme-color" content="#6d5dfc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Dépenses</title>
<style>
  :root {
    --bg: #f3f2f8; --card: #ffffff; --card2: #f1f0f6; --txt: #17161f; --mut: #8a8799; --line: #ecebf2;
    --accent: #6d5dfc; --accent2: #4f6bff; --up: #ef4444; --down: #16a34a; --danger: #ef4444; --orange: #f59e0b;
    --fab: #17161f; --fab-txt: #ffffff; --ombre: 0 10px 30px rgba(40, 30, 90, .12);
    --degrade: radial-gradient(120% 160% at 0% 0%, rgba(196, 181, 253, .55) 0%, transparent 55%), linear-gradient(135deg, #8b5cf6 0%, #6d5dfc 50%, #5b6cff 100%);
    --bas-barre: max(18px, calc(env(safe-area-inset-bottom) - 12px));
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f0e15; --card: #1a1922; --card2: #24232e; --txt: #f4f3fa; --mut: #8f8ca0; --line: #2c2a37;
      --fab: #f4f3fa; --fab-txt: #0f0e15; --ombre: 0 10px 30px rgba(0, 0, 0, .5); --up: #f87171; --down: #4ade80;
      --degrade: radial-gradient(120% 160% at 0% 0%, rgba(167, 139, 250, .28) 0%, transparent 55%), linear-gradient(135deg, #5b3fd6 0%, #4b3fc9 50%, #3a4bc9 100%); }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: var(--h, 100%); background: var(--bg); color: var(--txt); overscroll-behavior: none; overflow: hidden;
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; font-variant-numeric: tabular-nums; }
  .vide, .aide, .maj, .lbl, .sous { text-wrap: pretty; }
  /* 7. Repère de focus (clavier, accessibilité) */
  button:focus-visible, a:focus-visible, .clic:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }

  #appli { position: fixed; top: 0; left: 0; right: 0; height: var(--h, 100%); display: flex; flex-direction: column; overflow: hidden; }
  #contenu { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(130px + env(safe-area-inset-bottom)); }

  /* En-tête dégradé (façon Buddy) */
  .tete { background: var(--degrade); color: #fff; padding: calc(16px + env(safe-area-inset-top)) 16px 10px;
    box-shadow: 0 6px 24px rgba(79, 70, 229, .25); flex: none; position: relative; z-index: 3; }
  .tete-haut { display: flex; align-items: center; justify-content: space-between; max-width: 560px; margin: 0 auto; }
  .verre { width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.18);
    color: #fff; display: flex; align-items: center; justify-content: center; padding: 0; }
  .verre svg { width: 21px; height: 21px; }
  .ic-cal { width: 13px; height: 13px; vertical-align: -1px; margin-right: 6px; }
  .tete-titre { font-size: 16px; font-weight: 500; opacity: .95; }
  .tete-titre b { font-weight: 700; }
  .segments-tete { display: flex; justify-content: center; gap: 6px; margin: 10px auto 0; max-width: 560px; }
  .segments-tete:empty { display: none; }
  .segments-tete button { border: 0; background: none; color: rgba(255,255,255,.85); font-size: 12.5px; font-weight: 700;
    letter-spacing: .1em; padding: 9px 13px; border-radius: 99px; text-transform: uppercase; white-space: nowrap; }
  @media (max-width: 380px) { .segments-tete button { letter-spacing: .05em; padding: 9px 10px; font-size: 12px; } }
  .segments-tete button.actif { background: rgba(255,255,255,.22); color: #fff; }

  /* Barre du bas + bouton + */
  .onglets { position: absolute; left: 50%; transform: translateX(-50%); bottom: var(--bas-barre); display: flex; gap: 2px;
    width: min(88%, 440px);
    background: color-mix(in srgb, var(--card) 86%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--line); border-radius: 99px; padding: 5px; box-shadow: var(--ombre); z-index: 5; }
  .onglets button { flex: 1; border: 0; background: none; border-radius: 99px; padding: 8px 2px 6px; display: flex; flex-direction: column;
    align-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--mut); white-space: nowrap; }
  .onglets button svg { width: 23px; height: 23px; }
  .onglets button.actif { background: var(--card2); color: var(--txt); }
  .onglets button.actif svg { color: var(--accent); }
  .fab { position: absolute; right: 16px; bottom: calc(var(--bas-barre) + 74px); width: 58px; height: 58px; border-radius: 50%; border: 0;
    background: var(--fab); color: var(--fab-txt); font-size: 34px; font-weight: 300; line-height: 1; box-shadow: var(--ombre); z-index: 6; }
  .fab { transition: transform .25s cubic-bezier(.2, .9, .3, 1.2), opacity .2s; }
  .fab:active { transform: scale(.94); }
  .fab.cache { transform: translateY(24px) scale(.6); opacity: 0; pointer-events: none; }

  /* Cartes */
  .card { background: var(--card); border-radius: 24px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(40, 30, 90, .04); }
  h2 { font-size: 15px; font-weight: 700; letter-spacing: -.01em; color: var(--txt); margin: 0 0 12px; }
  .lbl { font-size: 12px; color: var(--mut); }
  .vide { color: var(--mut); text-align: center; padding: 24px 0; }
  .chargement { color: var(--mut); text-align: center; padding: 80px 0; }
  .squelette > div { background: var(--card); border-radius: 24px; margin-bottom: 14px; padding: 16px; }
  .squelette i { display: block; border-radius: 10px; background: var(--card2); animation: lueur 1.2s ease-in-out infinite alternate; }
  @keyframes lueur { to { opacity: .45; } }
  .maj { text-align: center; font-size: 12px; color: var(--mut); margin-top: 6px; }
  .positif { color: var(--down); }
  .negatif { color: var(--up); }
  .puce { border: 0; background: var(--card2); color: var(--txt); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 600; }

  /* Carte du mois */
  .carte-mois { display: flex; align-items: center; justify-content: space-between; background: var(--card); border-radius: 99px;
    padding: 7px 10px; margin-bottom: 14px; box-shadow: var(--ombre); }
  .carte-mois button { width: 38px; height: 38px; border: 0; background: none; font-size: 24px; color: var(--txt); font-weight: 300; }
  .carte-mois button:disabled { opacity: .2; }
  .carte-mois .centre { text-align: center; }
  .carte-mois .centre b { display: block; font-size: 17px; font-weight: 500; text-transform: capitalize; }
  .carte-mois .centre span { font-size: 12px; color: var(--mut); font-weight: 500; }
  .carte-mois .centre span i { font-style: normal; letter-spacing: 0; }

  /* Bloc revenus / dépenses / solde */
  .bilan3 { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; background: var(--card2); border-radius: 16px; padding: 13px 6px; }
  .bilan3 b { display: block; font-size: 17px; font-weight: 600; margin-bottom: 2px; letter-spacing: -.02em; }
  .bilan3 span { font-size: 12px; color: var(--mut); font-weight: 500; }

  /* Lignes de transaction (façon Buddy) */
  .tx { display: flex; align-items: center; gap: 13px; padding: 12px 0; background: var(--card); position: relative; }
  .pastille { width: 44px; height: 44px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .pastille img { width: 27px; height: 27px; border-radius: 8px; object-fit: contain; }
  .pastille.logo { background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
  .tx .info { flex: 1; min-width: 0; }
  .tx .date { font-size: 10px; font-weight: 700; letter-spacing: .13em; color: var(--mut); text-transform: uppercase; margin-bottom: 2px; }
  .tx .titre { font-size: 15.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx .sous { font-size: 13px; color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx .mt { font-size: 15.5px; font-weight: 600; text-align: right; white-space: nowrap; }
  .tx .mt.barre-txt { text-decoration: line-through; color: var(--mut); font-weight: 500; }
  .tx .ajout { display: block; border: 0; background: none; color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .08em;
    padding: 4px 0 0; text-transform: uppercase; margin-left: auto; }
  .tx .droite { flex: none; text-align: right; }
  .tx .date { white-space: nowrap; }
  .badge-mini { font-size: 11px; font-weight: 600; margin-left: 6px; }
  .badge-mini.etiq { color: var(--accent); }
  .badge-mini.remb { color: var(--orange); }
  .badge-mini.remb.ok { color: var(--mut); text-decoration: line-through; }
  .swipe { position: relative; overflow: hidden; }
  .swipe-fond { position: absolute; inset: 4px 0; background: var(--danger); color: #fff; border-radius: 16px; display: flex; align-items: center;
    justify-content: flex-end; padding-right: 18px; font-weight: 700; font-size: 14px; opacity: 0; }
  .swipe > .tx { touch-action: pan-y; transition: transform .2s; }
  .swipe + .swipe > .tx, .tx + .tx, .swipe + .tx, .tx + .swipe > .tx { border-top: 1px solid var(--line); }
  .filtre-actif { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 4px; }

  /* Lignes génériques (statistiques, outils) */
  .ligne { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
  .ligne + .ligne { border-top: 1px solid var(--line); }
  .clic { cursor: pointer; }
  .ligne .info { flex: 1; min-width: 0; }
  .ligne .nom { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ligne .sous { font-size: 13px; color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ligne .mt { font-weight: 700; text-align: right; white-space: nowrap; }
  .ligne .mt small { display: block; font-weight: 500; color: var(--mut); font-size: 12px; }
  .ico { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 19px; flex: none; background: var(--card2); }
  .ico img { width: 26px; height: 26px; border-radius: 7px; object-fit: contain; }
  .ico.logo { background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
  .jauge { height: 6px; border-radius: 99px; background: var(--card2); margin-top: 6px; overflow: hidden; }
  .jauge span { display: block; height: 100%; border-radius: 99px; }
  .cat.actif .nom { color: var(--accent); }
  .rang { width: 16px; font-size: 13px; font-weight: 700; color: var(--mut); text-align: center; flex: none; }

  /* Aperçu */
  .resume { display: flex; align-items: center; gap: 18px; margin-bottom: 16px; }
  .anneau { position: relative; width: 140px; height: 140px; flex: none; }
  .anneau svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .anneau .centre { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .anneau .centre .val { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .stats { display: grid; gap: 10px; flex: 1; min-width: 0; }
  .stat .val { font-size: 17px; font-weight: 700; }
  .badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
  .badge.up { background: color-mix(in srgb, var(--up) 15%, transparent); color: var(--up); }
  .badge.down { background: color-mix(in srgb, var(--down) 15%, transparent); color: var(--down); }
  .barre { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--card2); margin-bottom: 12px; }
  .barre span { height: 100%; }
  .legende { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; }
  .legende i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .legende b { margin-left: 4px; }
  .histo { display: flex; align-items: flex-end; gap: 8px; height: 130px; }
  .histo .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; cursor: pointer; }
  .histo .b { width: 100%; max-width: 34px; border-radius: 8px 8px 4px 4px; background: color-mix(in srgb, var(--accent) 30%, var(--card2)); min-height: 3px; }
  .histo .col.sel .b { background: var(--accent); }
  .histo .m { font-size: 11px; color: var(--mut); margin-top: 6px; text-transform: capitalize; }
  .histo .v { font-size: 10px; color: var(--mut); margin-bottom: 4px; white-space: nowrap; }
  .histo .col.sel .m, .histo .col.sel .v { color: var(--txt); font-weight: 700; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal .js { font-size: 11px; color: var(--mut); text-align: center; padding-bottom: 2px; }
  .cal button { aspect-ratio: 1; border: 0; border-radius: 10px; background: var(--card2); font-size: 13px; font-weight: 600; padding: 0; }
  .cal button.auj { box-shadow: inset 0 0 0 2px var(--accent); }
  .cal button:disabled { opacity: .3; }
  .cal-legende { display: flex; align-items: center; gap: 4px; justify-content: flex-end; font-size: 11px; color: var(--mut); margin-top: 10px; }
  .cal-legende i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .entre { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; gap: 10px; }
  .entre b { font-size: 24px; letter-spacing: -.02em; }

  /* Outils : catégories façon Buddy */
  .groupe-titre { font-size: 22px; font-weight: 500; margin: 0 0 6px; display: flex; align-items: center; gap: 10px; }
  .groupe-titre button { border: 0; background: none; font-size: 18px; padding: 0; color: var(--mut); }
  .moins { width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--danger); color: #fff; font-size: 22px;
    line-height: 1; flex: none; display: flex; align-items: center; justify-content: center; padding-bottom: 3px; }
  .action-ligne { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; color: var(--mut); cursor: pointer; font-size: 16px; }
  .action-ligne + .action-ligne { border-top: 1px solid var(--line); }
  .action-ligne span:last-child { font-size: 22px; }

  /* + / - (à recevoir, à payer) */
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .duo > div { background: var(--card2); border-radius: 18px; padding: 14px; }
  .duo b { display: block; font-size: 22px; letter-spacing: -.02em; margin-top: 2px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; background: var(--degrade); }
  .avatar.plus { background: color-mix(in srgb, var(--down) 16%, var(--card)); color: var(--down); font-size: 20px; }
  .avatar.moins { background: color-mix(in srgb, var(--up) 14%, var(--card)); color: var(--up); font-size: 20px; }

  /* Revenus (comme le Dashboard) */
  .rev-total { font-size: 34px; font-weight: 800; letter-spacing: -.03em; color: var(--down); margin: 2px 0 10px; font-variant-numeric: tabular-nums; }
  .rev-ligne { padding: 10px 0; }
  .rev-ligne + .rev-ligne { border-top: 1px solid var(--line); }
  .rev-ligne .ligne { padding: 0; }
  .rev-ligne .mt.zero { color: var(--mut); font-weight: 500; }
  .rev-detail { margin: 6px 0 0 52px; display: grid; gap: 2px; }
  .rev-detail div { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; color: var(--mut); padding: 4px 0; cursor: pointer; }
  .rev-detail b { color: var(--txt); font-weight: 600; font-variant-numeric: tabular-nums; }
  .synchro-dash { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--mut); text-decoration: none; }
  .synchro-dash span:last-child { margin-left: auto; color: var(--accent); font-weight: 600; }
  .histo2 { display: flex; align-items: flex-end; gap: 10px; height: 120px; }
  .histo2 .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; cursor: pointer; }
  .histo2 .barres { display: flex; align-items: flex-end; gap: 3px; height: 100%; width: 100%; justify-content: center; }
  .histo2 .barres i { width: 40%; max-width: 14px; border-radius: 5px 5px 2px 2px; min-height: 3px; }
  .histo2 .m { font-size: 11px; color: var(--mut); margin-top: 6px; text-transform: capitalize; }
  .histo2 .col.sel .m { color: var(--txt); font-weight: 700; }

  /* Choix de la couleur d'une catégorie */
  .couleurs { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 4px; }
  .couleurs button { width: 36px; height: 36px; border-radius: 50%; border: 0; padding: 0; position: relative; }
  .couleurs button.sel { box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--txt); }
  .couleurs button.auto { background: conic-gradient(#a855f7, #4f6bff, #10b981, #eab308, #ef4444, #a855f7); font-size: 0; }
  .couleurs label { width: 36px; height: 36px; border-radius: 50%; border: 1.5px dashed var(--mut); display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--mut); position: relative; overflow: hidden; }
  .couleurs label input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }
  .ok-btn { border: 0; background: color-mix(in srgb, var(--down) 15%, transparent); color: var(--down); border-radius: 99px; padding: 7px 11px; font-size: 13px; font-weight: 700; white-space: nowrap; }

  /* Recherche */
  .champ-recherche { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 16px; padding: 12px 14px; margin-bottom: 14px; box-shadow: var(--ombre); }
  .champ-recherche input { flex: 1; border: 0; background: none; outline: none; font-size: 17px; min-width: 0; }

  /* Interrupteur */
  .switch { position: relative; width: 50px; height: 30px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--card2); transition: .2s; border: 1px solid var(--line); }
  .switch i::after { content: ''; position: absolute; width: 24px; height: 24px; left: 2px; top: 2px; border-radius: 50%; background: #fff; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .switch input:checked + i { background: var(--down); border-color: var(--down); }
  .switch input:checked + i::after { transform: translateX(20px); }

  /* Feuilles (panneaux qui montent du bas) */
  #couche { position: absolute; inset: 0; z-index: 20; display: none; }
  #couche.ouvert { display: block; }
  .voile { position: absolute; inset: 0; background: rgba(15, 10, 40, .45); opacity: 0; transition: opacity .2s; }
  #couche.visible .voile { opacity: 1; }
  .feuille { position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100% - env(safe-area-inset-top) - 18px); overflow-y: auto; background: var(--card);
    border-radius: 30px 30px 0 0; padding: 14px 18px calc(30px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .25s ease-out; max-width: 600px; margin: 0 auto; }
  #couche.visible .feuille { transform: none; }
  .feuille.pleine { height: calc(100% - env(safe-area-inset-top) - 18px); display: flex; flex-direction: column; padding-bottom: 0; }

  /* Nouvelle transaction façon Buddy */
  .saisie-montant { display: flex; align-items: baseline; justify-content: center; margin: 4px 0 10px; }
  .saisie-montant input { border: 0; background: none; outline: none; font-size: 60px; font-weight: 300; text-align: right; padding: 0;
    width: .9em; max-width: 80%; caret-color: var(--accent); }
  .saisie-montant span { font-size: 30px; font-weight: 300; margin-left: 10px; }
  .types { display: flex; justify-content: center; gap: 8px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin: 0 -18px; }
  .types button { border: 0; background: none; border-radius: 99px; padding: 11px 22px; font-size: 12.5px; font-weight: 600; letter-spacing: .16em; color: var(--txt); }
  .types button.sel { background: var(--card2); }
  .rangee { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); min-height: 64px; position: relative; }
  .rangee .rond-ic { width: 40px; height: 40px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 19px; }
  .rangee .ic-trait { width: 40px; flex: none; display: flex; justify-content: center; color: var(--txt); }
  .rangee .ic-trait svg { width: 26px; height: 26px; }
  .rangee .texte { flex: 1; font-size: 16px; color: var(--mut); min-width: 0; }
  .rangee .texte b { color: var(--txt); font-weight: 600; }
  .rangee input[type=text] { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 16px; padding: 0; }
  .rangee select.cache { position: absolute; inset: 0; opacity: 0; width: 100%; font-size: 16px; }
  .rangee .fleches { display: flex; gap: 6px; }
  .rangee .fleches button { border: 0; background: none; font-size: 26px; padding: 0 8px; color: var(--txt); }
  .rangee .fleches button:disabled { opacity: .2; }
  .sous-champs { padding: 4px 0 6px 54px; border-bottom: 1px solid var(--line); }
  .sous-champs .ligne-champ { display: flex; align-items: center; gap: 10px; padding: 8px 0; }

  /* Choix de catégorie façon Buddy */
  .choix-tete { display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px; }
  .choix-tete h3 { margin: 0; font-size: 18px; }
  .pilule { display: flex; border: 1px solid var(--line); border-radius: 99px; background: var(--card); box-shadow: var(--ombre); }
  .pilule button { border: 0; background: none; width: 46px; height: 42px; display: flex; align-items: center; justify-content: center; color: var(--txt); }
  .pilule button svg { width: 22px; height: 22px; }
  .choix-corps { flex: 1; overflow-y: auto; margin: 0 -18px; padding: 0 18px calc(100px + env(safe-area-inset-bottom)); }
  .choix-groupe { font-size: 21px; font-weight: 400; padding: 14px 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .choix-grille { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 6px; margin-bottom: 10px; }
  .choix-grille button { border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 0; }
  .choix-grille .bulle { width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 25px; }
  .choix-grille .bulle.sel { box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--accent); }
  .choix-grille span { font-size: 11.5px; color: var(--txt); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .choix-recherche { position: absolute; left: 18px; right: 18px; bottom: calc(env(safe-area-inset-bottom) + 12px); display: flex; align-items: center; gap: 10px;
    background: color-mix(in srgb, var(--card) 85%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--line); border-radius: 99px; padding: 12px 18px; box-shadow: var(--ombre); }
  .choix-recherche svg { width: 20px; height: 20px; flex: none; }
  .choix-recherche input { flex: 1; border: 0; background: none; outline: none; font-size: 16px; min-width: 0; }

  .feuille-tete { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .feuille-tete h3 { margin: 0; font-size: 18px; }
  .rond { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); font-size: 18px; box-shadow: var(--ombre); }
  .gros-montant { display: flex; align-items: baseline; justify-content: center; gap: 6px; margin: 6px 0 16px; }
  .gros-montant input { width: 100%; max-width: 220px; text-align: center; font-size: 64px; font-weight: 300; border: 0; background: none; outline: none; padding: 0; }
  .gros-montant span { font-size: 34px; font-weight: 300; }
  .segments { display: flex; background: var(--card2); border-radius: 14px; padding: 3px; flex: 1; }
  .segments button { flex: 1; border: 0; background: none; border-radius: 11px; padding: 9px 2px; font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--mut); text-transform: uppercase; }
  .segments button.sel { background: var(--card); color: var(--txt); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .champ { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
  .champ > .ic { width: 30px; text-align: center; font-size: 21px; flex: none; }
  .champ input[type=text], .champ input[type=number], .champ select { flex: 1; min-width: 0; border: 0; background: none; outline: none; padding: 4px 0; font-size: 17px; }
  .champ select { -webkit-appearance: none; appearance: none; }
  .champ .etiq { flex: 1; color: var(--mut); font-size: 16px; }
  .date-nav { flex: 1; display: flex; align-items: center; justify-content: space-between; }
  .date-nav button { border: 0; background: none; font-size: 24px; padding: 0 10px; color: var(--txt); }
  .date-nav label { position: relative; font-size: 17px; }
  .date-nav label input { position: absolute; inset: 0; opacity: 0; width: 100%; }
  .grille-cats h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--mut); margin: 12px 0 8px; }

  .grille button { border: 1px solid var(--line); background: var(--card2); border-radius: 99px; padding: 8px 12px; font-size: 14px; }
  .grille button.sel { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .emojis { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .emojis button { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--card2); font-size: 20px; }
  .emojis button.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 22%, var(--card2)); }
  .btn { display: block; width: 100%; border: 0; border-radius: 99px; padding: 18px; font-size: 16px; font-weight: 700; letter-spacing: .14em; margin-top: 20px; }
  .btn.principal { background: var(--fab); color: var(--fab-txt); }
  .btn.danger { background: none; color: var(--danger); margin-top: 8px; font-weight: 600; letter-spacing: 0; }
  .aide { font-size: 12px; color: var(--mut); margin: 4px 0 0 42px; }

  /* Connexion */
  .connexion { text-align: center; padding-top: 40px; }
  .connexion .logo { width: 88px; height: 88px; border-radius: 22px; margin: 0 auto 18px; display: block; box-shadow: var(--ombre); }
  .connexion input { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 16px; padding: 16px; font-size: 16px; text-align: center; outline: none; }

  /* Message temporaire */
  /* Message de validation / d'erreur : carte claire, texte sur 2-3 lignes, jamais coupé */
  #toast { position: absolute; left: 12px; right: 12px; top: calc(10px + env(safe-area-inset-top)); margin: 0 auto; max-width: 440px;
    display: flex; align-items: center; gap: 12px; padding: 11px 12px 11px 11px; border-radius: 20px; z-index: 30;
    background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    color: var(--txt); box-shadow: 0 14px 34px rgba(30, 20, 80, .18), inset 0 0 0 1px var(--line);
    transform: translateY(calc(-100% - 30px)); opacity: 0; transition: transform .38s cubic-bezier(.2, .9, .3, 1.15), opacity .2s; pointer-events: none; }
  #toast.visible { transform: none; opacity: 1; pointer-events: auto; }
  #toast .t-ic { width: 36px; height: 36px; border-radius: 12px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 18px;
    background: color-mix(in srgb, var(--t, var(--accent)) 15%, transparent); }
  #toast .t-txt { flex: 1; min-width: 0; font-size: 14.5px; font-weight: 650; line-height: 1.3; overflow-wrap: anywhere; }
  #toast .t-txt small { display: block; font-weight: 500; color: var(--mut); font-size: 13px; margin-top: 1px; }
  #toast button { flex: none; border: 0; border-radius: 99px; padding: 8px 13px; font-size: 13.5px; font-weight: 700;
    background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  #toast.erreur { box-shadow: 0 14px 34px rgba(120, 20, 30, .16), inset 0 0 0 1px color-mix(in srgb, var(--danger) 35%, var(--line)); }

  /* Liste groupée par jour (façon Buddy) */
  .jour { display: flex; align-items: baseline; gap: 8px; margin: 24px 0 2px; }
  .jour:first-child, .bilan3 + .jour, .prevision + .jour, .filtre-actif + .jour { margin-top: 18px; }
  .jour b { font-size: 17px; font-weight: 700; white-space: nowrap; }

  .a-venir-titre { font-size: 10.5px; letter-spacing: .14em; font-weight: 700; color: var(--mut); text-transform: uppercase; margin: 18px 0 0; }
  .attente { font-size: 11px; margin-left: 6px; color: var(--orange); font-weight: 700; }

  /* Prévision et alertes */
  .prevision { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; padding: 11px 14px;
    border-radius: 14px; background: color-mix(in srgb, var(--accent) 9%, var(--card)); font-size: 13.5px; }
  .prevision b { font-weight: 700; }

  .suggeree { font-size: 11px; font-weight: 700; color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent);
    border-radius: 99px; padding: 3px 8px; margin-left: 8px; white-space: nowrap; }

  /* Recherche avancée */
  .filtres { display: flex; gap: 6px; overflow-x: auto; margin: -4px -16px 14px; padding: 0 16px 2px; scrollbar-width: none; }
  .filtres::-webkit-scrollbar { display: none; }
  .filtres button { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 7px 12px; font-size: 13px; font-weight: 600; }
  .filtres button.sel { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Tirer pour rafraîchir */
  .tirer { height: 0; overflow: visible; display: flex; justify-content: center; position: relative; z-index: 1; pointer-events: none; }
  .tirer span { width: 34px; height: 34px; margin-top: 8px; border-radius: 50%; background: var(--card); box-shadow: var(--ombre); display: flex;
    align-items: center; justify-content: center; font-size: 18px; color: var(--accent); opacity: 0; transform: translateY(-40px); }
  .tirer.tourne span { opacity: 1; transform: translateY(6px); animation: tourne .8s linear infinite; transition: transform .2s; }
  @keyframes tourne { to { rotate: 360deg; } }

  /* Rétrospective */
  .carte-retro { background: var(--degrade); color: #fff; cursor: pointer; display: flex; align-items: center; gap: 14px; }
  .carte-retro .gros { font-size: 34px; }
  .carte-retro b { display: block; font-size: 17px; }
  .carte-retro span { font-size: 13px; opacity: .85; }
  .retro { flex: 1; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 12px; margin: 4px -18px 0; padding: 0 18px 18px; scrollbar-width: none; }
  .retro::-webkit-scrollbar { display: none; }
  .diapo { flex: 0 0 calc(100% - 8px); scroll-snap-align: center; border-radius: 28px; padding: 28px 22px; color: #fff; display: flex; flex-direction: column;
    justify-content: center; gap: 10px; min-height: 60vh; }
  .diapo .eti { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; opacity: .8; }
  .diapo .enorme { font-size: 46px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
  .diapo .moyen { font-size: 20px; font-weight: 600; }
  .diapo .lst { display: grid; gap: 10px; margin-top: 6px; }
  .diapo .lst div { display: flex; justify-content: space-between; gap: 10px; font-size: 16px; background: rgba(255,255,255,.14); border-radius: 14px; padding: 11px 14px; }
  .points { display: flex; justify-content: center; gap: 6px; padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
  .points i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }

  /* Fluidité : retour visuel au toucher */
  .clic, .puce, .tx, .carte-mois button, .segments-tete button, .onglets button, .grille button, .choix-grille button, .action-ligne, .rond, .btn, .ok-btn, .verre, .filtres button, .bandeau {
    transition: transform .12s ease, opacity .12s ease, background-color .2s; }
  .clic:active, .puce:active, .carte-mois button:active, .segments-tete button:active, .onglets button:active, .grille button:active,
  .choix-grille button:active, .action-ligne:active, .rond:active, .btn:active, .ok-btn:active, .verre:active, .filtres button:active, .bandeau:active { transform: scale(.96); }
  .swipe > .tx:active { opacity: .7; }
  #contenu { overscroll-behavior-y: contain; }
  main.entree > * { animation: entree .28s ease both; }
  main.entree > *:nth-child(2) { animation-delay: .03s; } main.entree > *:nth-child(3) { animation-delay: .06s; } main.entree > *:nth-child(n+4) { animation-delay: .09s; }
  @keyframes entree { from { opacity: 0; transform: translateY(8px); } }

  /* Changement de mois : le contenu glisse, la pilule du mois reste en place */
  main { view-transition-name: contenu-mois; }
  .carte-mois { view-transition-name: pilule-mois; }
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; }
  ::view-transition-old(contenu-mois) { animation: sortie-g .24s ease both; }
  ::view-transition-new(contenu-mois) { animation: arrivee-d .24s ease both; }
  html[data-sens=prec]::view-transition-old(contenu-mois) { animation-name: sortie-d; }
  html[data-sens=prec]::view-transition-new(contenu-mois) { animation-name: arrivee-g; }
  @keyframes sortie-g { to { transform: translateX(-40%); opacity: 0; } }
  @keyframes sortie-d { to { transform: translateX(40%); opacity: 0; } }
  @keyframes arrivee-d { from { transform: translateX(40%); opacity: 0; } }
  @keyframes arrivee-g { from { transform: translateX(-40%); opacity: 0; } }
  main.glisse-suiv { animation: arrivee-d .24s ease both; }
  main.glisse-prec { animation: arrivee-g .24s ease both; }
  @media (prefers-reduced-motion: reduce) { *, ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; transition: none !important; } }
</style>

const commerceCache = {};
function commerce(note) {
  const n = sansAccents(note);
  if (!n) return null;
  if (!(n in commerceCache)) {
    const t = COMMERCES.find(([re]) => re.test(n));
    commerceCache[n] = t ? { nom: t[1], domaine: t[2] } : null;
  }
  return commerceCache[n];
}

const estRevenu = r => groupeDe(r) === GROUPE_REVENUS;

function groupes() {
  const g = [];
  categories.forEach(c => { if (c.groupe && !g.includes(c.groupe)) g.push(c.groupe); });
  return g.sort((a, b) => (a === GROUPE_REVENUS) - (b === GROUPE_REVENUS));
}
// Couleur de fond de l'icône : celle choisie pour la catégorie, sinon celle de son groupe
const couleurCategorie = (nom, groupe) => (categorie(nom) || {}).couleur || couleurGroupe(groupe || groupeCat(nom));
const couleurDe = r => couleurCategorie(r.c, groupeDe(r));
function couleurGroupe(g) {
  if (COULEURS_GROUPES[g]) return COULEURS_GROUPES[g];
  const autres = groupes().filter(x => !COULEURS_GROUPES[x]);
  return PALETTE[(1 + Math.max(autres.indexOf(g), 0)) % PALETTE.length];
}

// Le code est gardé à deux endroits (stockage local + cookie de 10 ans) pour ne jamais le redemander
function lireCookie() { const m = document.cookie.match(/(?:^|; )depcode=([^;]*)/); return m ? decodeURIComponent(m[1]) : ''; }
function lireCode() {
  let c = '';
  try { c = localStorage.getItem(CLE_CODE) || ''; } catch (e) {}
  if (!c) { c = lireCookie(); if (c) try { localStorage.setItem(CLE_CODE, c); } catch (e) {} }
  return c;
}
function enregistrerCode(v) {
  try { localStorage.setItem(CLE_CODE, v); } catch (e) {}
  document.cookie = `depcode=${encodeURIComponent(v)}; max-age=${10 * 365 * 24 * 3600}; path=/; SameSite=Strict; Secure`;
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  return !!lireCode();
}
function oublierCode() {
  try { localStorage.removeItem(CLE_CODE); } catch (e) {}
  document.cookie = 'depcode=; max-age=0; path=/; SameSite=Strict; Secure';
}
// Lien d'installation : …/depenses/#code=XXXX enregistre le code puis l'efface de l'adresse
(function () {
  const m = location.hash.match(/code=([^&]+)/);
  if (m) { enregistrerCode(decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname + location.search); }
})();

function appel(action, ...args) {
  if (MODE_DEMO) {
    if (demoHorsLigne) return Promise.reject(new TypeError('Load failed'));
    return new Promise((ok, ko) => setTimeout(() => {
      try { ok(DEMO[action](...args.map(a => JSON.parse(JSON.stringify(a ?? null))))); } catch (e) { ko(e); }
    }, 350));
  }
  // text/plain : requête « simple », sans pré-vol CORS (qu'Apps Script ne gère pas)
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ cle: lireCode(), action, args }) })
    .then(r => r.json())
    .then(j => {
      if (j.ok) return j.resultat;
      if (/Accès refusé/.test(j.message)) afficherConnexion('Code refusé, vérifie-le.');
      throw new Error(j.message.replace(/^❌\s*/, ''));
    });
}

// Les réponses parties avant la dernière écriture sont ignorées (sinon l'ancien état revient un instant)
let ecrituresEnCours = 0, derniereEcriture = 0, dernierChargement = 0;
function charger() {
  if (!MODE_DEMO && !lireCode()) return afficherConnexion();
  const debut = Date.now();
  dernierChargement = debut;
  return appel('getTout').then(t => {
    // Tant que des saisies hors ligne attendent, le serveur ne les connaît pas encore : on garde l'état local
    if (ecrituresEnCours > 0 || debut < derniereEcriture || (fileAttente.length && charge)) {
      if (synchro) { synchro = false; if (!feuilleOuverte()) render(); }
      return finirTirer();
    }
    recevoir(t);
  }).catch(err => {
    finirTirer();
    if (synchro && charge) { synchro = false; if (!feuilleOuverte()) render(); }
    if (/Accès refusé/.test(err.message)) return; // l'écran du code est déjà affiché
    if (!charge) document.querySelector('main').innerHTML = `<div class="chargement">⚠️ ${esc(err.message)}<br><br><button class="puce" onclick="charger()">Réessayer</button></div>`;
    else if (estErreurReseau(err)) toast('📴 Hors ligne : tes données locales restent affichées');
    else toast('⚠️ Synchro impossible : ' + err.message);
  });
}

/* ---------- Retour haptique ---------- */
// iPhone (Safari 18+) : un clic sur un interrupteur système caché déclenche la vibration native ; Android : navigator.vibrate
let etiquetteHaptique = null;
function haptique() {
  try {
    if (navigator.vibrate) { navigator.vibrate(10); return; }
    if (!etiquetteHaptique) {
      etiquetteHaptique = document.createElement('label');
      etiquetteHaptique.setAttribute('aria-hidden', 'true');
      etiquetteHaptique.style.cssText = 'position:fixed;left:-200px;top:0;width:1px;height:1px;overflow:hidden;opacity:0';
      const i = document.createElement('input');
      i.type = 'checkbox'; i.setAttribute('switch', ''); i.tabIndex = -1;
      etiquetteHaptique.appendChild(i);
      document.body.appendChild(etiquetteHaptique);
    }
    etiquetteHaptique.click();
  } catch (e) { /* pas de vibration disponible */ }
}

/* ---------- Saisie hors ligne : file d'attente envoyée au retour du réseau ---------- */
const CLE_FILE = MODE_DEMO ? 'depenses-demo-file' : 'depenses-file';
let fileAttente = [];
try { fileAttente = JSON.parse(localStorage.getItem(CLE_FILE) || '[]'); } catch (e) { fileAttente = []; }
let demoHorsLigne = false; // ?demo : permet de simuler une coupure réseau
function sauverFile() { try { localStorage.setItem(CLE_FILE, JSON.stringify(fileAttente)); } catch (e) {} }
const estErreurReseau = e => !navigator.onLine || (e && (e.name === 'TypeError' || e.horsLigne));
// Identifiants des transactions pas encore envoyées (badge ⏳)
function idsEnAttente() {
  const ids = new Set();
  fileAttente.forEach(x => { const a = x.args[0]; if (a && typeof a === 'object') ids.add(a.id || a.idClient); else if (typeof a === 'string') ids.add(a); });
  return ids;
}
function nouvelIdClient() {
  const lettres = 'abcdefghjkmnpqrstuvwxyz23456789';
  const b = new Uint8Array(8);
  (window.crypto || {}).getRandomValues ? crypto.getRandomValues(b) : b.forEach((_, i) => { b[i] = Math.random() * 256; });
  return 'c' + Array.from(b.slice(0, 7), v => lettres[v % lettres.length]).join('');
}
let envoiFileEnCours = false;
function envoyerFile() {
  if (envoiFileEnCours || !fileAttente.length || (!MODE_DEMO && !lireCode())) return Promise.resolve();
  envoiFileEnCours = true;
  let envoyes = 0;
  const suivant = () => {
    if (!fileAttente.length) return Promise.resolve();
    const x = fileAttente[0];
    return appel(x.action, ...x.args).then(() => {
      fileAttente.shift(); sauverFile(); envoyes++;
      return suivant();
    }, e => {
      if (estErreurReseau(e)) return; // toujours hors ligne : on réessaiera plus tard
      fileAttente.shift(); sauverFile(); // refus du serveur : inutile d'insister
      toast('⚠️ ' + e.message);
      return suivant();
    });
  };
  return suivant().finally(() => {
    envoiFileEnCours = false;
    if (envoyes) {
      haptique();
      toast(`☁️ ${envoyes} saisie${envoyes > 1 ? 's' : ''} hors ligne synchronisée${envoyes > 1 ? 's' : ''}`);
      derniereEcriture = Date.now();
      if (!fileAttente.length) setTimeout(charger, 50);
    }
    if (charge && !feuilleOuverte()) render();
  });
}
window.addEventListener('online', () => { envoyerFile(); memoriserLogos(); });

function ecrire(action, args, appliquerLocal, messageOk) {
  if (appliquerLocal) appliquerLocal();
  sauverCache();
  if (!feuilleOuverte()) render();
  const mettreEnFile = () => {
    fileAttente.push({ action, args, ts: Date.now() }); sauverFile();
    if (!feuilleOuverte()) render();
    toast('📴 Enregistré hors ligne · envoi au retour du réseau', null, 3000);
  };
  // Déjà des saisies en attente : on garde l'ordre (la création passe avant une modification)
  if (fileAttente.length || (!MODE_DEMO && !navigator.onLine) || (MODE_DEMO && demoHorsLigne)) { mettreEnFile(); return Promise.resolve(); }
  ecrituresEnCours++;
  return appel(action, ...args)
    .then(res => { if (messageOk) toast(messageOk); return res; })
    .catch(e => {
      if (estErreurReseau(e)) mettreEnFile();
      else toast('⚠️ ' + e.message);
      derniereEcriture = Date.now();
    })
    .finally(() => {
      ecrituresEnCours--;
      derniereEcriture = Date.now();
      if (!ecrituresEnCours && !fileAttente.length) setTimeout(charger, 50);
    });
}

function recevoir(t, depuisCache) {
  depenses = (t.depenses || []).map(r => ({ ...r, date: new Date(r.d) }))
    .filter(r => !isNaN(r.date) && r.m > 0 && !enAttenteSuppression[r.id]);
  categories = t.categories || [];
  recurrentes = t.recurrentes || [];
  dettes = (t.dettes || []).map(d => ({ ...d, date: new Date(d.d) }));
  if (t.dashboard !== undefined) etatDashboard = t.dashboard;
  if (depuisCache) majA = new Date(t.majA || Date.now());
  else { majA = new Date(); synchro = false; sauverCache(); finirTirer(); }
  charge = true;
  if (!feuilleOuverte()) render();
}

function sauverCache() {
  if (!charge) return;
  const brut = { depenses: depenses.map(({ date, ...r }) => ({ ...r, d: versTexteDate(date) + ':00' })),
    categories, recurrentes, dettes: dettes.map(({ date, ...d }) => ({ ...d, d: versTexteDate(date) + ':00' })), dashboard: etatDashboard,
    majA: majA ? majA.getTime() : Date.now() };
  try { localStorage.setItem(CLE_CACHE, JSON.stringify(brut)); } catch (e) { /* stockage indisponible */ }
}

// Ouverture instantanée : dernières données connues, puis synchro
function chargerCache() {
  try {
    const t = JSON.parse(localStorage.getItem(CLE_CACHE) || 'null');
    if (t && t.depenses) recevoir(t, true);
  } catch (e) { /* cache absent ou illisible */ }
}

// « ✅ Titre · détail » → icône + titre + détail sur sa propre ligne ; couleur selon l'icône (succès, alerte, hors ligne…)
let toastMinuteur;
const TONS_TOAST = { '✅': 'var(--down)', '☁️': 'var(--down)', '↩︎': 'var(--down)', '⚠️': 'var(--orange)', '🚨': 'var(--danger)', '📴': 'var(--orange)', '🗑': 'var(--danger)' };
function toast(msg, action, duree) {
  const t = document.getElementById('toast');
  const m = String(msg).match(/^(\p{Extended_Pictographic}\uFE0F?|↩︎|↻)\s*(.*)$/su);
  const icone = m ? m[1] : 'ℹ️', texte = m ? m[2] : String(msg);
  const i = texte.indexOf(' · ');
  const titre = i > 0 ? texte.slice(0, i) : texte, detail = i > 0 ? texte.slice(i + 3) : '';
  const erreur = icone === '⚠️' && !action && /impossible|introuvable|refus|invalide|erreur/i.test(texte);
  t.className = erreur ? 'erreur' : '';
  t.style.setProperty('--t', erreur ? 'var(--danger)' : TONS_TOAST[icone] || 'var(--accent)');
  t.innerHTML = `<div class="t-ic">${esc(icone)}</div><div class="t-txt">${esc(titre)}${detail ? `<small>${esc(detail)}</small>` : ''}</div>`
    + (action ? `<button>${esc(action.texte)}</button>` : '');
  if (action) t.querySelector('button').onclick = e => { e.stopPropagation(); t.classList.remove('visible'); action.fn(); };
  t.onclick = () => t.classList.remove('visible');
  void t.offsetWidth;
  t.classList.add('visible');
  clearTimeout(toastMinuteur);
  toastMinuteur = setTimeout(() => t.classList.remove('visible'), duree || (erreur ? 4500 : detail ? 3200 : 2400));
}

/* ---------- Connexion ---------- */
function afficherConnexion(erreur) {
  document.getElementById('segments').innerHTML = '';
  document.getElementById('fab').style.display = 'none';
  document.querySelector('.onglets').style.display = 'none';
  document.querySelector('main').innerHTML = `
    <div class="connexion">
      <img class="logo" src="icon-192.png" alt="">
      <h2 style="font-size:20px;text-transform:none;letter-spacing:0;color:var(--txt)">Bienvenue 👋</h2>

      ${erreur ? `<p class="negatif" style="font-weight:600">${esc(erreur)}</p>` : ''}
      <input id="code" type="password" placeholder="Code d'accès" autocomplete="off" autocapitalize="off"
        onkeydown="if(event.key==='Enter')validerCode()">

function validerCode() {

  if (!v) return;

  document.getElementById('fab').style.display = '';

  document.querySelector('main').innerHTML = '<div class="squelette" aria-label="Chargement"><div style="border-radius:99px;padding:14px 60px"><i style="height:20px;margin:0 auto;width:60%"></i></div><div><i style="height:62px;border-radius:16px"></i><i style="height:14px;width:40%;margin:22px 0 14px"></i><i style="height:44px;margin-bottom:12px"></i><i style="height:44px;margin-bottom:12px"></i><i style="height:44px"></i></div></div>';
  charger();
}
function seDeconnecter() {
  confirmer('Changer de code ?', 'Tes données restent dans le Google Sheet. Il faudra recoller le code.', 'Se déconnecter').then(oui => {
    if (!oui) return;
    oublierCode(); try { localStorage.removeItem(CLE_CACHE); } catch (e) {}
    charge = false; afficherConnexion();
  });
}

/* ---------- Rendu ---------- */
const SEGMENTS = {
  accueil: [['liste', 'Liste'], ['apercu', 'Aperçu'], ['budget', 'Budget']],
  outils: [['recurrentes', 'Récurrentes'], ['categories', 'Catégories'], ['reglages', 'Réglages']],
};

function render() {
  if (!charge) return;
  document.querySelectorAll('.onglets button').forEach(b => b.classList.toggle('actif', b.dataset.o === onglet));
  const segs = rechercheActive ? [] : (SEGMENTS[onglet] || []);
  document.getElementById('segments').innerHTML = segs.map(([k, l]) =>
    `<button class="${sousOnglets[onglet] === k ? 'actif' : ''}" onclick="changerSousOnglet('${k}')">${l}</button>`).join('');
  document.getElementById('titre').innerHTML = rechercheActive ? '<b>Recherche</b>'
    : onglet === 'dettes' ? '<b>+ / -</b>' : onglet === 'revenus' ? '<b>Revenus</b>' : onglet === 'outils' ? '<b>Outils</b>'
    : `<b>${{ liste: 'Mes dépenses', apercu: 'Aperçu', budget: 'Budget' }[sousOnglets.accueil] || 'Mes dépenses'}</b>`;
  if (rechercheActive) return renderRecherche();
  let html;
  if (onglet === 'dettes') html = vueDettes();
  else if (onglet === 'revenus') html = vueRevenus();
  else if (onglet === 'outils') {
    const s = sousOnglets.outils;
    html = s === 'categories' ? vueCategories() : s === 'reglages' ? vueReglages() : vueRecurrentes();
  } else {
    const s = sousOnglets.accueil;
    html = s === 'apercu' ? vueApercu() : s === 'budget' ? vueBudget() : vueListe();
  }
  const nAttente = fileAttente.length;
  const etat = nAttente ? `⏳ ${nAttente} saisie${nAttente > 1 ? 's' : ''} en attente de réseau`
    : synchro ? '↻ synchro…' : 'À jour · ' + majA.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  const main = document.querySelector('main');
  main.innerHTML = html + `<div class="maj">${etat} · v${VERSION}${MODE_DEMO ? ' · démo' : ''}</div>`;
  if (animerEntree) { animerEntree = false; main.classList.remove('entree'); void main.offsetWidth; main.classList.add('entree'); }
  else main.classList.remove('entree');
}
// Les cartes apparaissent en fondu quand on change d'écran (pas lors des synchros en arrière-plan)
let animerEntree = false;
document.querySelector('main').addEventListener('animationend', e => { if (e.target.tagName === 'MAIN') e.target.classList.remove('glisse-suiv', 'glisse-prec'); });

function changerOnglet(o, sous) {
  onglet = o; if (sous) sousOnglets[o] = sous;
  catFiltre = null; jourFiltre = null; rechercheActive = false;
  animerEntree = true;
  render(); document.getElementById('contenu').scrollTop = 0;
}
function changerSousOnglet(k) { sousOnglets[onglet] = k; animerEntree = true; render(); document.getElementById('contenu').scrollTop = 0; }

function boutonPlus() {
  if (onglet === 'dettes') return ouvrirDette(null);
  if (onglet === 'revenus') return ouvrirDepense(null, true);
  if (onglet === 'outils' && sousOnglets.outils === 'recurrentes') return ouvrirRecurrente(null);
  if (onglet === 'outils' && sousOnglets.outils === 'categories') return ouvrirCategorie(null);
  ouvrirDepense(null);
}

// Une transaction datée plus tard (ex. Sosh le 27) est « prévue » : elle attend dans « À venir » et ne compte pas encore
const estPrevue = r => r.date > new Date();
function duMois(k) { return depenses.filter(r => cleMois(r.date) === k && !estPrevue(r)); } // dépenses + revenus
function prevuesDuMois(k) { return depenses.filter(r => cleMois(r.date) === k && estPrevue(r)).sort((a, b) => a.date - b.date); }
function depensesDuMois(k) { return duMois(k).filter(r => !estRevenu(r)); }          // dépenses seules

const MOIS_FUTURS = 12; // on peut regarder jusqu'à 12 mois à l'avance (dépenses récurrentes prévues)
const moisMax = () => decaler(cleMois(new Date()), MOIS_FUTURS);
const estFutur = k => k > cleMois(new Date());

function carteMois() {
  const futur = estFutur(moisSel);
  const nb = futur ? aVenirDuMois(moisSel).length + prevuesDuMois(moisSel).length : duMois(moisSel).length;
  const premier = depenses.length ? cleMois(new Date(Math.min(...depenses.map(r => r.date)))) : moisSel;
  return `
    <div class="carte-mois">
      <button onclick="changerMois(-1)" ${moisSel <= premier ? 'disabled' : ''} aria-label="Mois précédent">‹</button>
      <div class="centre"><b>${nomMois(moisSel)}</b><span>${nb} ${futur ? 'prévue' : 'transaction'}${nb > 1 ? 's' : ''}</span></div>
      <button onclick="changerMois(1)" ${moisSel >= moisMax() ? 'disabled' : ''} aria-label="Mois suivant">›</button>
    </div>`;
}

// Montants avec data-v : ils « montent » jusqu'à leur valeur quand on change de mois
function bilan3(tout, libelleDepenses) {
  const total = somme(tout.filter(r => !estRevenu(r)));
  const revenus = somme(tout.filter(estRevenu));
  const solde = revenus - total;
  return `<div class="bilan3">
    <div><b data-v="${revenus}">${eur0(revenus)}</b><span>Revenus</span></div>
    <div><b data-v="${total}">${eur0(total)}</b><span>${libelleDepenses || 'Dépenses'}</span></div>
    <div><b data-v="${solde}" class="${solde >= 0 ? '' : 'negatif'}">${solde < 0 ? '-' : ''}${eur0(Math.abs(solde))}</b><span>Solde</span></div>
  </div>`;
}
function animerMontants() {
  const els = [...document.querySelectorAll('.bilan3 b[data-v]')];
  if (!els.length || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const debut = performance.now(), duree = 380;
  const pas = t => {
    const p = Math.min((t - debut) / duree, 1), e = 1 - Math.pow(1 - p, 3);
    els.forEach(el => { const v = Number(el.dataset.v) * e; el.textContent = (v < -0.5 ? '-' : '') + eur0(Math.abs(v)); });
    if (p < 1) requestAnimationFrame(pas);
  };
  requestAnimationFrame(pas);
}

// « Aujourd'hui », « Hier », « Demain », sinon « Mardi 29 sept. »
function libelleJourListe(d) {
  const auj = new Date(), ecart = n => { const x = new Date(auj); x.setDate(x.getDate() + n); return x; };
  if (memeJour(d, auj)) return "Aujourd'hui";
  if (memeJour(d, ecart(-1))) return 'Hier';
  if (memeJour(d, ecart(1))) return 'Demain';
  return majuscule(d.toLocaleDateString('fr-FR', { weekday: 'long', day: '2-digit', month: 'short' }));
}
// Transactions regroupées par jour, avec le total du jour à droite
function listeParJour(liste) {
  const jours = [];
  liste.forEach(r => {
    const k = r.date.toDateString();
    if (!jours.length || jours[jours.length - 1].k !== k) jours.push({ k, d: r.date, rs: [] });
    jours[jours.length - 1].rs.push(r);
  });
  return jours.map(j => {
    const net = somme(j.rs.filter(estRevenu)) - somme(j.rs.filter(r => !estRevenu(r)));
    return `<div class="jour"><b>${esc(libelleJourListe(j.d))}</b><i></i>
      <span class="${net > 0 ? 'positif' : ''}">${net > 0 ? '+' : net < 0 ? '-' : ''}${eur0(Math.abs(net))}</span></div>
      ${j.rs.map(r => ligneTx(r, true)).join('')}`;
  }).join('');
}

// Catégories qui ont dépassé leur budget ce mois-ci
function budgetsDepasses(k) {
  const parCat = {};
  depensesDuMois(k).forEach(r => { parCat[r.c] = (parCat[r.c] || 0) + r.m; });
  return categoriesActives().filter(c => c.budget > 0 && c.groupe !== GROUPE_REVENUS && (parCat[c.nom] || 0) >= c.budget)
    .map(c => ({ c, p: parCat[c.nom] / c.budget })).sort((a, b) => b.p - a.p);
}

// Fin de mois prévue = déjà dépensé + récurrentes encore à venir ; reste par jour sur les budgets
function carteprevision(tout, aVenir, prevues) {
  const depense = somme(tout.filter(r => !estRevenu(r)));
  const prevu = aVenir.filter(x => groupeCat(x.r.categorie) !== GROUPE_REVENUS).reduce((s, x) => s + x.r.montant, 0)
    + somme(prevues.filter(r => !estRevenu(r)));
  const fin = depense + prevu;
  const budgets = categoriesActives().filter(c => c.budget > 0 && c.groupe !== GROUPE_REVENUS);
  let reste = '';
  if (budgets.length) {
    const noms = new Set(budgets.map(c => c.nom));
    const total = budgets.reduce((s, c) => s + c.budget, 0);
    const engage = somme(tout.filter(r => !estRevenu(r) && noms.has(r.c)))
      + aVenir.filter(x => noms.has(x.r.categorie)).reduce((s, x) => s + x.r.montant, 0)
      + somme(prevues.filter(r => noms.has(r.c)));
    const auj = new Date();
    const jours = dernierJour(auj.getFullYear(), auj.getMonth()) - auj.getDate() + 1;
    const parJour = (total - engage) / jours;
    reste = `<span class="${parJour < 0 ? 'negatif' : ''}">reste <b>${parJour < 0 ? '-' : ''}${eur0(Math.abs(parJour))}</b>/jour</span>`;
  }
  return `<div class="prevision clic" onclick="changerSousOnglet('budget')"><span>Fin de mois prévue : <b>${eur0(fin)}</b></span>${reste}</div>`;
}

/* ===== LISTE (écran d'ouverture, façon Buddy) ===== */
function vueListe() {
  const tout = duMois(moisSel);
  const estMoisActuel = moisSel === cleMois(new Date());
  const futur = estFutur(moisSel);
  const filtre = r => (!catFiltre || r.c === catFiltre) && (!jourFiltre || r.date.getDate() === jourFiltre);
  const liste = tout.filter(filtre).sort((a, b) => b.date - a.date);
  const aVenir = (estMoisActuel || futur) && !catFiltre && !jourFiltre ? aVenirDuMois(moisSel) : [];
  const prevues = !catFiltre && !jourFiltre ? prevuesDuMois(moisSel) : [];
  const libFiltre = jourFiltre ? new Date(dateDeCle(moisSel).getFullYear(), dateDeCle(moisSel).getMonth(), jourFiltre)
    .toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }) : catFiltre;
  // Mois à venir : le récap porte sur ce qui est prévu
  const prevus = aVenir.map(({ r }) => ({ m: r.montant, c: r.categorie, g: groupeCat(r.categorie) })).concat(prevues);
  const depasses = estMoisActuel && !libFiltre ? budgetsDepasses(moisSel) : [];
  return `
    ${carteMois()}
    ${depasses.length ? `<div class="bandeau" onclick="changerSousOnglet('budget')"><span style="font-size:20px">🚨</span>
      <span>Budget dépassé : ${depasses.slice(0, 3).map(x => `<b>${esc(x.c.nom)}</b> (${Math.round(x.p * 100)} %)`).join(', ')}${depasses.length > 3 ? '…' : ''}</span></div>` : ''}
    <section class="card">
      ${futur ? bilan3(prevus, 'Prévu') : bilan3(tout)}
      ${estMoisActuel && !libFiltre ? carteprevision(tout, aVenir, prevues) : ''}
      ${libFiltre ? `<div class="filtre-actif"><b style="text-transform:capitalize">${esc(libFiltre)}</b>
        <button class="puce" onclick="catFiltre=null;jourFiltre=null;render()">Tout voir</button></div>` : ''}
      ${aVenir.length || prevues.length ? `<div class="a-venir-titre">${futur ? 'Prévues ce mois-là' : 'À venir'}</div>` : ''}
      ${aVenir.map(({ r, d }) => ({ d, html: `
        <div class="tx clic" onclick="ouvrirDepuisRecurrente(${r.ligne}, ${d.getTime()})">
          ${pastille(r.libelle, emojiCat(r.categorie), couleurCategorie(r.categorie))}
          <div class="info"><div class="date">${ICONE_CAL}${dateCourte(d)}</div><div class="titre">${esc(r.libelle)}</div><div class="sous">${esc(r.categorie)}</div></div>
          <div class="droite"><div class="mt barre-txt">${eur(r.montant)}</div>
            ${futur ? '' : `<button class="ajout" onclick="event.stopPropagation();ajouterRecurrenteMaintenant(${r.ligne})">+ Ajouter</button>`}</div>
        </div>` })).concat(prevues.map(r => ({ d: r.date, html: `
        <div class="tx clic" onclick="ouvrirDepense(${attr(r.id)})">
          ${pastille(r.n, emojiDe(r), couleurDe(r))}
          <div class="info"><div class="date">${ICONE_CAL}${dateCourte(r.date)}</div><div class="titre">${esc(r.n || r.c)}</div><div class="sous">${r.n ? esc(r.c) : 'Prévue'}</div></div>
          <div class="droite"><div class="mt barre-txt">${estRevenu(r) ? '+' : ''}${eur(r.m)}</div>
            <button class="ajout" onclick="event.stopPropagation();validerPrevue(${attr(r.id)})">+ Ajouter</button></div>
        </div>` }))).sort((x, y) => x.d - y.d).map(x => x.html).join('')}
      ${liste.length ? listeParJour(liste) : (aVenir.length || prevues.length ? '' : `<div class="vide">${futur ? 'Rien de prévu ce mois-là.' : 'Aucune transaction ce mois-ci.<br>Touche + pour en ajouter une.'}</div>`)}
    </section>
    ${liste.length > 2 ? '<div class="maj" style="margin-bottom:8px">Glisse une ligne vers la gauche pour la supprimer</div>' : ''}`;
}

// Une transaction (avec le geste « glisser pour supprimer ») ; sansDate : la date est déjà dans l'en-tête du jour
function ligneTx(r, sansDate) {
  const rev = estRevenu(r);
  const badges = (r.s === 'Récurrente' ? '<span class="badge-mini etiq">↻</span>' : '')
    + (estPrevue(r) ? '<span class="badge-mini etiq">🗓️ prévue</span>' : '')
    + (r.qui ? `<span class="badge-mini remb ${r.remb ? 'ok' : ''}">💸 ${esc(r.qui)}</span>` : '');
  const attente = fileAttente.length && idsEnAttente().has(r.id) ? '<span class="attente">⏳</span>' : '';
  return `
    <div class="swipe" data-id="${esc(r.id)}"><div class="swipe-fond">Supprimer</div>
      <div class="tx clic" onclick="if(!gesteEnCours)ouvrirDepense(${attr(r.id)})">
        ${pastille(r.n, emojiDe(r), couleurDe(r))}
        <div class="info">${sansDate ? '' : `<div class="date">${ICONE_CAL}${dateCourte(r.date)}</div>`}
          <div class="titre">${esc(r.n || r.c)}${attente}</div>
          <div class="sous">${r.n ? esc(r.c) : ''}${badges}</div></div>
        <div class="mt ${rev ? 'positif' : ''}">${rev ? '+' : '-'}${eur(r.m)}</div>
      </div></div>`;
}

/* ===== APERÇU (statistiques) ===== */
function vueApercu() {
  const tout = duMois(moisSel);
  const rs = tout.filter(r => !estRevenu(r));
  const total = somme(rs);
  const estMoisActuel = moisSel === cleMois(new Date());
  const jourMax = estMoisActuel ? new Date().getDate() : 31;
  const totalPrec = somme(depensesDuMois(decaler(moisSel, -1)).filter(r => r.date.getDate() <= jourMax));

  const parCat = {};
  rs.forEach(r => { parCat[r.c] = (parCat[r.c] || 0) + r.m; });
  // Même période le mois d'avant (jusqu'au même jour si c'est le mois en cours)
  const parCatPrec = {};
  depensesDuMois(decaler(moisSel, -1)).filter(r => r.date.getDate() <= jourMax).forEach(r => { parCatPrec[r.c] = (parCatPrec[r.c] || 0) + r.m; });
  const aDesDonneesPrec = Object.keys(parCatPrec).length > 0;
  const delta = c => {
    if (!aDesDonneesPrec) return '';
    const avant = parCatPrec[c] || 0, d = (parCat[c] || 0) - avant;
    if (!avant) return '<small><span class="delta nouv">nouveau</span></small>';
    if (Math.abs(d) < 1) return '<small><span class="delta">= stable</span></small>';
    return `<small><span class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${eur0(Math.abs(d))}</span></small>`;
  };
  const cats = Object.entries(parCat).sort((a, b) => b[1] - a[1]);
  const couleurCat = {};
  cats.forEach(([c], i) => { couleurCat[c] = (categorie(c) || {}).couleur || (i < PALETTE.length ? PALETTE[i] : '#94a3b8'); });
  const parGroupe = {};
  rs.forEach(r => { const g = groupeDe(r); parGroupe[g] = (parGroupe[g] || 0) + r.m; });
  const ordreGroupes = groupes().concat(Object.keys(parGroupe).filter(g => !groupes().includes(g))).filter(g => parGroupe[g]);
  const jours = estMoisActuel ? new Date().getDate() : dernierJour(dateDeCle(moisSel).getFullYear(), dateDeCle(moisSel).getMonth());
  const evol = totalPrec > 0 ? (total - totalPrec) / totalPrec : null;

  let html = `${carteMois()}
    <section class="card">
      <div class="resume">
        <div class="anneau">${anneau(cats, couleurCat, total)}
          <div class="centre"><span class="lbl">Dépenses</span><span class="val">${eur0(total)}</span></div></div>
        <div class="stats">
          <div class="stat"><div class="lbl">Dépenses</div><div class="val">${rs.length}</div></div>
          <div class="stat"><div class="lbl">Moyenne / jour</div><div class="val">${eur(total / Math.max(jours, 1))}</div></div>
          <div class="stat"><div class="lbl">vs ${nomMois(decaler(moisSel, -1), { month: 'long' })}${estMoisActuel ? ' au ' + jourMax : ''}</div>
            <div class="val">${evol === null ? '<span class="lbl">—</span>'
              : `<span class="badge ${evol > 0 ? 'up' : 'down'}">${evol > 0 ? '▲' : '▼'} ${Math.abs(evol * 100).toFixed(0)} %</span>`}</div></div>
        </div>
      </div>
      ${bilan3(tout)}
    </section>`;

  if (total > 0) {
    html += `
    <section class="card">
      <h2>Par groupe</h2>
      <div class="barre">${ordreGroupes.map(g => `<span style="width:${parGroupe[g] / total * 100}%;background:${couleurGroupe(g)}"></span>`).join('')}</div>
      <div class="legende">${ordreGroupes.map(g => `<span><i style="background:${couleurGroupe(g)}"></i>${esc(g)}<b>${eur0(parGroupe[g])}</b></span>`).join('')}</div>
    </section>
    <section class="card">
      <h2>Par catégorie${aDesDonneesPrec ? ` <span style="font-weight:500;color:var(--mut)">· vs ${nomMois(decaler(moisSel, -1), { month: 'long' })}</span>` : ''}</h2>
      ${cats.map(([c, v]) => {
        const b = (categorie(c) || {}).budget;
        return `
        <div class="ligne clic cat" onclick="voirCategorieDansListe(${attr(c)})">
          <div class="ico" style="background:color-mix(in srgb, ${couleurCat[c]} 20%, var(--card))">${esc(emojiCat(c))}</div>
          <div class="info"><div class="nom">${esc(c)}</div>
            <div class="jauge"><span style="width:${v / cats[0][1] * 100}%;background:${couleurCat[c]}"></span></div>
            <div class="sous" style="font-size:12px;margin-top:4px">${(v / total * 100).toFixed(0)} % du mois${b ? ' · ' + Math.round(v / b * 100) + ' % du budget' : ''}</div></div>
          <div class="mt">${eur(v)}${delta(c)}</div>
        </div>`;
      }).join('')}
    </section>`;
  }
  html += carteCalendrier(rs);
  const tops = topCommerces(rs);
  if (tops.length) {
    html += `<section class="card"><h2>Top commerces</h2>
      ${tops.map((t, i) => `
        <div class="ligne"><div class="rang">${i + 1}</div>
          ${pastille(t.exemple.n, emojiDe(t.exemple), couleurDe(t.exemple), 'ico')}

function ouvrirRetro(annee) { haptique(); ouvrirFeuille({ type: 'retro', annee }); }
function feuilleRetro(f) {

    'linear-gradient(150deg,#10b981,#0ea5e9)', 'linear-gradient(150deg,#0ea5e9,#6d5dfc)', 'linear-gradient(150deg,#eab308,#f97316)'];
  const diapos = [];
  diapos.push(`<div class="eti">${an}${an === new Date().getFullYear() ? ' · jusqu\'ici' : ''}</div><div class="moyen">Tu as dépensé</div>

  if (tops.length) diapos.push(`<div class="eti">Tes commerces préférés</div>

function anneau(cats, couleurCat, total) {
  const r = 58, C = 2 * Math.PI * r, ep = 16;
  if (!total) return `<svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--card2)" stroke-width="${ep}"/></svg>`;
  let off = 0, arcs = '';
  const ecart = cats.length > 1 ? 2 : 0;
  cats.forEach(([c, v]) => {
    const len = v / total * C;
    arcs += `<circle cx="70" cy="70" r="${r}" fill="none" stroke="${couleurCat[c]}" stroke-width="${ep}"
      stroke-dasharray="${Math.max(len - ecart, 0.5)} ${C}" stroke-dashoffset="${-off}"/>`;
    off += len;
  });
  return `<svg viewBox="0 0 140 140">${arcs}</svg>`;
}

function histo() {
  const mois = [];

      <div class="m">${nomMois(k, { month: 'short' }).replace('.', '')}</div></div>`;

function topCommerces(rs) {
  const g = {};
  rs.forEach(r => {
    const co = commerce(r.n);
    const cle = co ? co.nom : sansAccents(r.n);
    if (!cle) return;
    if (!g[cle]) g[cle] = { nom: co ? co.nom : majuscule(r.n.trim()), nb: 0, total: 0, exemple: r };
    g[cle].nb++; g[cle].total += r.m;
  });
  return Object.values(g).sort((a, b) => b.total - a.total).slice(0, 5);
}

function carteCalendrier(rs) {

  const max = Math.max(0, ...Object.values(parJour));

  const niveau = v => !v ? 0 : Math.min(5, Math.ceil(v / max * 5));

}

function reglerElement(type, id, oui) {
  if (type === 'avance') {
    const r = depenses.find(x => x.id === id);
    return ecrire('marquerRembourse', [id, oui], () => { if (r) r.remb = oui; },
      oui ? `✅ Réglé${r ? ' · ' + r.qui : ''}` : '↩︎ Remis en attente');
  }
  const d = dettes.find(x => x.id === id);
  ecrire('reglerDette', [id, oui], () => { if (d) d.regle = oui; },
    oui ? `✅ ${d && d.sens === 'Je dois' ? 'Payé' : 'Reçu'}${d ? ' · ' + d.qui + ' · ' + eur(d.m) : ''}` : '↩︎ Remis en attente');
}

/* ===== OUTILS : Récurrentes ===== */
const estDue = (rec, mois1) => { const n = rec.frequence || 1; return ((mois1 - (rec.moisDepart || 1)) % n + n) % n === 0; };
function prochaineDate(rec) {
  if (!rec.actif) return null;
  const auj = new Date(); auj.setHours(0, 0, 0, 0);
  for (let i = 0; i < 25; i++) {
    const d = new Date(auj.getFullYear(), auj.getMonth() + i, 1);
    if (!estDue(rec, d.getMonth() + 1)) continue;
    if (i === 0 && rec.dernierAjout === cleMois(d)) continue;
    d.setDate(Math.min(rec.jour, dernierJour(d.getFullYear(), d.getMonth())));
    if (i === 0 && d < auj) return auj;
    return d;
  }
  return null;
}
// Récurrentes prévues pour le mois k : ce mois-ci, celles pas encore ajoutées ; mois suivants, toutes celles dues
function aVenirDuMois(k) {
  const kAuj = cleMois(new Date());
  if (k < kAuj) return [];
  if (k === kAuj) return recurrentes.map(r => ({ r, d: prochaineDate(r) })).filter(x => x.d && cleMois(x.d) === k).sort((a, b) => b.d - a.d);
  const d0 = dateDeCle(k), an = d0.getFullYear(), m0 = d0.getMonth();
  return recurrentes.filter(r => r.actif && estDue(r, m0 + 1))
    .map(r => ({ r, d: new Date(an, m0, Math.min(r.jour, dernierJour(an, m0))) }))
    .sort((a, b) => b.d - a.d);
}
function libellePeriode(rec) {
  const j = rec.jour === 1 ? '1er' : rec.jour;
  const f = rec.frequence || 1;
  if (f === 1) return `Chaque mois le ${j}`;
  if (f === 12) return `Chaque année le ${j} ${NOMS_MOIS[rec.moisDepart - 1]}`;
  const mois = [];
  for (let m = rec.moisDepart; mois.length < 12 / f; m += f) mois.push(new Date(2026, (m - 1) % 12, 1).toLocaleDateString('fr-FR', { month: 'short' }));
  return `Tous les ${f} mois le ${j} (${mois.join(', ')})`;
}
function ajouterRecurrenteMaintenant(ligne) {
  const r = recurrentes.find(x => x.ligne === ligne);
  if (!r) return;
  const maintenant = new Date();
  ecrire('ajouterRecurrenteMaintenant', [ligne], () => {
    r.dernierAjout = cleMois(maintenant);
    depenses = depenses.concat({ id: 'tmp-' + Date.now(), d: versTexteDate(maintenant), date: maintenant, m: r.montant, c: r.categorie,
      n: r.libelle, s: 'Récurrente', g: groupeCat(r.categorie), e: emojiCat(r.categorie), t: '', qui: '', du: 0, remb: false });
  }, `✅ ${r.libelle} ajouté`);
}
function vueRecurrentes() {
  const actives = recurrentes.filter(r => r.actif);
  const parMois = actives.reduce((s, r) => s + r.montant / (r.frequence || 1), 0);
  const tri = recurrentes.slice().sort((a, b) => {
    const da = prochaineDate(a), db = prochaineDate(b);
    if (!da || !db) return da ? -1 : db ? 1 : 0;
    return da - db;
  });
  return `
    <section class="card">
      <div class="lbl">Coût moyen par mois</div>
      <div style="font-size:30px;font-weight:800;letter-spacing:-.02em">${eur(parMois)}</div>
      <div class="lbl">${actives.length} active${actives.length > 1 ? 's' : ''} · ${eur0(parMois * 12)} par an</div>
    </section>
    <section class="card">
      ${tri.length ? tri.map(r => {
        const d = prochaineDate(r);
        return `<div class="ligne" style="${r.actif ? '' : 'opacity:.5'}">
          <div class="clic" style="flex:1;min-width:0;display:flex;align-items:center;gap:12px" onclick="ouvrirRecurrente(${r.ligne})">
            ${pastille(r.libelle, emojiCat(r.categorie), couleurCategorie(r.categorie), 'ico')}
            <div class="info"><div class="nom" style="white-space:normal">${esc(r.libelle)}</div>
              <div class="sous" style="white-space:normal">${esc(libellePeriode(r))}</div>
              <div class="sous">${d ? 'Prochaine : ' + d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' }) : 'En pause'}</div></div>
            <div class="mt">${eur(r.montant)}</div></div>
          <label class="switch"><input type="checkbox" ${r.actif ? 'checked' : ''} onchange="basculerRecurrente(${r.ligne}, this.checked)"><i></i></label>
        </div>`;
      }).join('') : '<div class="vide">Aucune dépense récurrente.<br>Touche + pour en ajouter une.</div>'}
    </section>
    <div class="maj" style="margin-bottom:6px">Changer un prix ne modifie pas les mois déjà passés.</div>`;
}
function basculerRecurrente(ligne, actif) {
  const r = recurrentes.find(x => x.ligne === ligne);
  if (r) ecrire('enregistrerRecurrente', [{ ...r, actif }], () => { r.actif = actif; }, actif ? '✅ Réactivée' : '⏸ En pause');
}

      <input id="champ-recherche" type="search" placeholder="McDo, Sosh, >50…" value="${esc(rechercheTexte)}"

// Filtres de la recherche : montant minimum, période, type ; « >50 » ou « <20 » se tapent aussi dans le champ
const filtresRecherche = { min: 0, periode: 'tout', type: 'tous' };
const PERIODES_RECHERCHE = [['mois', 'Ce mois'], ['3m', '3 mois'], ['an', 'Cette année'], ['tout', 'Tout']];
function dessinerFiltres() {
  const z = document.getElementById('filtres');
  if (!z) return;
  const f = filtresRecherche;
  const b = (sel, txt, js) => `<button class="${sel ? 'sel' : ''}" onclick="${js}">${txt}</button>`;
  z.innerHTML = [20, 50, 100].map(n => b(f.min === n, `> ${n} €`, `filtresRecherche.min=${f.min === n ? 0 : n};majResultats()`)).join('')
    + '<span class="sep"></span>'
    + PERIODES_RECHERCHE.map(([k, l]) => b(f.periode === k, l, `filtresRecherche.periode='${k}';majResultats()`)).join('')
    + '<span class="sep"></span>'
    + b(f.type === 'dep', 'Dépenses', `filtresRecherche.type='${f.type === 'dep' ? 'tous' : 'dep'}';majResultats()`)
    + b(f.type === 'rev', 'Revenus', `filtresRecherche.type='${f.type === 'rev' ? 'tous' : 'rev'}';majResultats()`);
}
function passeFiltres(r, bornes) {
  const f = filtresRecherche, auj = new Date();
  if (r.m < Math.max(f.min, bornes.min || 0)) return false;
  if (bornes.max && r.m > bornes.max) return false;
  if (f.type === 'dep' && estRevenu(r)) return false;
  if (f.type === 'rev' && !estRevenu(r)) return false;
  if (f.periode === 'mois' && cleMois(r.date) !== cleMois(auj)) return false;
  if (f.periode === '3m' && r.date < new Date(auj.getFullYear(), auj.getMonth() - 2, 1)) return false;
  if (f.periode === 'an' && r.date.getFullYear() !== auj.getFullYear()) return false;
  return true;
}
function correspond(r, mots) {
  const co = commerce(r.n);
  const texte = sansAccents([r.n, r.c, r.t, r.qui, co ? co.nom : ''].join(' '));
  return mots.every(m => texte.includes(m));
}
function majResultats() {
  const zone = document.getElementById('resultats');
  if (!zone) return;
  dessinerFiltres();
  const bornes = {};
  const mots = sansAccents(rechercheTexte).replace(/([<>])\s+(\d)/g, '$1$2').split(' ').filter(m => {
    const b = m.match(/^([<>])(\d+(?:[.,]\d+)?)€?$/);
    if (!b) return !!m;
    bornes[b[1] === '>' ? 'min' : 'max'] = parseFloat(b[2].replace(',', '.'));
    return false;
  });
  const f = filtresRecherche;
  const filtreActif = f.min || f.periode !== 'tout' || f.type !== 'tous' || bornes.min || bornes.max;
  if (!mots.length && !filtreActif) {
    zone.innerHTML = '<div class="vide">Cherche une note, un commerce ou une catégorie.<br>Astuce : « bk >10 » ou « sosh ».</div>';
    return;
  }
  const res = depenses.filter(r => correspond(r, mots) && passeFiltres(r, bornes)).sort((a, b) => b.date - a.date);
  const dep = res.filter(r => !estRevenu(r));
  const parMois = {};
  res.forEach(r => { (parMois[cleMois(r.date)] = parMois[cleMois(r.date)] || []).push(r); });
  zone.innerHTML = !res.length ? '<div class="vide">Aucun résultat</div>' : `
    <section class="card">
      <div class="lbl">${dep.length} dépense${dep.length > 1 ? 's' : ''}</div>
      <div style="font-size:30px;font-weight:800;letter-spacing:-.02em">${eur(somme(dep))}</div>
      ${dep.length > 1 ? `<div class="lbl">soit ${eur(somme(dep) / dep.length)} en moyenne</div>` : ''}
    </section>
    ${Object.entries(parMois).map(([k, rs]) => `
      <section class="card">
        <div class="entre"><h2 style="margin:0;text-transform:capitalize">${nomMois(k)}</h2><span class="lbl">${eur(somme(rs.filter(r => !estRevenu(r))))}</span></div>
        ${rs.map(ligneTx).join('')}
      </section>`).join('')}`;
}

/* ===== Glisser pour supprimer (Annuler pendant 5 s) ===== */
let gesteEnCours = false;
(function () {
  let el = null, x0 = 0, y0 = 0, dx = 0, sens = null;
  document.addEventListener('pointerdown', e => {
    const s = e.target.closest('.swipe');
    if (!s || !e.isPrimary || el || feuilleOuverte()) return;
    el = s; x0 = e.clientX; y0 = e.clientY; dx = 0; sens = null;
  });
  document.addEventListener('pointermove', e => {
    if (!el) return;
    const ddx = e.clientX - x0, ddy = e.clientY - y0;
    if (!sens && (Math.abs(ddx) > 8 || Math.abs(ddy) > 8)) sens = Math.abs(ddx) > Math.abs(ddy) ? 'h' : 'v';
    if (sens !== 'h') return;
    gesteEnCours = true;
    dx = Math.min(0, ddx);
    const ligne = el.querySelector('.tx');
    ligne.style.transition = 'none';
    ligne.style.transform = `translateX(${dx}px)`;
    el.querySelector('.swipe-fond').style.opacity = Math.min(1, -dx / 80);
  });
  const fin = () => {
    if (!el) return;
    const s = el, ligne = s.querySelector('.tx');
    ligne.style.transition = '';
    if (sens === 'h' && -dx > s.offsetWidth * 0.4) {
      ligne.style.transform = 'translateX(-110%)';
      setTimeout(() => supprimerAvecAnnuler(s.dataset.id), 180);
    } else {
      ligne.style.transform = '';
      s.querySelector('.swipe-fond').style.opacity = 0;
    }
    el = null;
    setTimeout(() => { gesteEnCours = false; }, 50);
  };
  document.addEventListener('pointerup', fin);
  document.addEventListener('pointercancel', fin);
})();

function supprimerAvecAnnuler(id) {
  const r = depenses.find(x => x.id === id);
  if (!r || enAttenteSuppression[id]) return;
  haptique();
  depenses = depenses.filter(x => x.id !== id);
  render();
  // Le jeton garantit qu'une suppression annulée n'est jamais envoyée
  const jeton = {};
  jeton.minuteur = setTimeout(() => {
    if (enAttenteSuppression[id] !== jeton) return;
    delete enAttenteSuppression[id];
    ecrire('supprimerDepense', [id]);
  }, 5000);
  enAttenteSuppression[id] = jeton;
  toast(`🗑 ${r.n || r.c} · ${eur(r.m)} supprimé`, { texte: 'Annuler', fn: () => {
    if (enAttenteSuppression[id] !== jeton) return;
    clearTimeout(jeton.minuteur); delete enAttenteSuppression[id];
    depenses = depenses.concat(r); render(); toast('↩︎ Restauré');
  } }, 5000);
}

let feuilleEtat = null;

  dessinerFeuille();

function fermerFeuille() {
